</div>

<div id="loadingIndicator" class="hide">
  <div class="spinner"></div>
  <div id="loadingText">Loading your binder…</div>
</div>

<div id="toast"></div>

<!-- hidden file input for scan — no capture attr so iOS shows "Take Photo / Choose from Library" -->
<input type="file" id="scanFileInput" accept="image/*" style="display:none">

<script>
/* =====================================================================
   FIREBASE CONFIG
   ---------------------------------------------------------------------
   Paste your real Firebase project config below. To get it:
   1. Go to https://console.firebase.google.com → create/open a project
   2. Project settings → General → "Your apps" → Web app → copy config
   3. Enable Firestore: Build → Firestore Database → Create database
   4. (Recommended for a personal app) Set Firestore rules to allow
      read/write only for your own use, e.g. during development:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /{document=**} { allow read, write: if true; }
          }
        }
      Lock this down later if you add real authentication.
   Until you paste real values here, the app runs in offline/local mode
   (saved to localStorage) so you can still use and test it.
===================================================================== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const BINDER_DOC_PATH = { collection: "binders", doc: "louis-binder" };
const PAGES_COUNT = 12;
const SLOTS_PER_PAGE = 9;
const LOCAL_KEY = "louis_binder_local_v1";

let db = null;
let firebaseReady = false;

function isFirebaseConfigured(){
  return firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY" && firebaseConfig.projectId !== "YOUR_PROJECT_ID";
}

try {
  if (isFirebaseConfigured() && window.firebase) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
} catch (e) {
  console.warn("Firebase init failed, falling back to local storage.", e);
  firebaseReady = false;
}

/* ---------------------------------------------------------------------
   STATE
   binderState = {
     apiKey: "",
     pages: [ [slot,slot,...9], [slot,...9], ... ]  // slot or null
   }
   slot = { cardId, name, image, set, owned, quantity, condition, notes }
--------------------------------------------------------------------- */
let binderState = {
  apiKey: "",
  anthropicKey: "",
  coverImage: null,
  revealCooldown: 'none',  // 'none' | '1h' | '6h' | '24h' | 'daily'
  lastRevealTime: null,    // ms timestamp of the last full card reveal
  pages: makeEmptyPages(PAGES_COUNT)
};

function makeEmptyPages(count){
  const pages = [];
  for (let p = 0; p < count; p++){
    pages.push(new Array(SLOTS_PER_PAGE).fill(null));
  }
  return pages;
}

let currentSpread = 0; // a "spread" = two facing pages (left,right), but we treat pages individually flipping
let activeSlotRef = null; // {pageIndex, slotIndex} when detail panel open
let pendingPickSlotRef = null; // when search panel open for placing a card

/* ---------------------------------------------------------------------
   PERSISTENCE
--------------------------------------------------------------------- */
function showLoading(text){
  document.getElementById('loadingText').textContent = text || "Loading…";
  document.getElementById('loadingIndicator').classList.remove('hide');
}
function hideLoading(){
  document.getElementById('loadingIndicator').classList.add('hide');
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveLocal(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(binderState)); }catch(e){}
}

async function loadBinder(){
  showLoading("Loading your binder…");
  if (firebaseReady){
    try{
      const ref = db.collection(BINDER_DOC_PATH.collection).doc(BINDER_DOC_PATH.doc);
      const snap = await ref.get();
      if (snap.exists){
        const data = snap.data();
        binderState = normalizeLoaded(data);
      } else {
        await ref.set(binderState);
      }
      ref.onSnapshot((doc) => {
        if (doc.exists){
          binderState = normalizeLoaded(doc.data());
          renderAll();
          applyCoverImage(binderState.coverImage || null);
        }
      });
    }catch(e){
      console.warn("Firestore load failed, using local storage.", e);
      const local = loadLocal();
      if (local) binderState = normalizeLoaded(local);
      toast("Cloud sync unavailable — using local storage.");
    }
  } else {
    const local = loadLocal();
    if (local) binderState = normalizeLoaded(local);
  }
  hideLoading();
  renderAll();
  loadCorrections();
  initCoverImage();
  initFogControls(); // wire up fog toggle + reset buttons
  initGallery(); // wire up gallery toggle + filter/sort/search controls
  initLandscapeMode(); // landscape two-page spread mode
  initCardViewer(); // card zoom lightbox
}

function normalizeLoaded(data){
  const out = { apiKey: data.apiKey || "", anthropicKey: data.anthropicKey || "", coverImage: data.coverImage || null, revealCooldown: data.revealCooldown || 'none', lastRevealTime: data.lastRevealTime || null, pages: [] };
  const pages = Array.isArray(data.pages) ? data.pages : [];
  // use saved page count (variable), fall back to default if none saved
  const count = pages.length || PAGES_COUNT;
  for (let p = 0; p < count; p++){
    const src = pages[p] || [];
    const page = new Array(SLOTS_PER_PAGE).fill(null);
    for (let s = 0; s < SLOTS_PER_PAGE; s++){
      page[s] = src[s] || null;
    }
    out.pages.push(page);
  }
  return out;
}

let saveTimer = null;
function persist(){
  saveLocal();
  if (firebaseReady){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try{
        const ref = db.collection(BINDER_DOC_PATH.collection).doc(BINDER_DOC_PATH.doc);
        await ref.set(binderState);
      }catch(e){
        console.warn("Failed to save to Firestore.", e);
        toast("Couldn't sync to cloud — saved locally.");
      }
    }, 250);
  }
}

/* ---------------------------------------------------------------------
   COVER OPEN
--------------------------------------------------------------------- */
document.getElementById('cover').addEventListener('click', () => {
  const cover = document.getElementById('cover');
  cover.classList.add('opened');
  setTimeout(() => {
    document.getElementById('coverStage').classList.add('hide');
    document.getElementById('app').classList.add('visible');
    loadBinder();
  }, 900);
});

/* closeBinder — reverses the cover-open animation so the user can return to
   the cover screen. Sequence:
   1. Add .closing to #app  → opacity fades to 0 over 0.6 s (CSS transition)
   2. After fade: remove .visible and .closing → #app snaps back to display:none
   3. Un-hide #coverStage, then on the next two animation frames remove .opened
      so the cover swings back smoothly (two rAFs ensure layout is painted first) */
function closeBinder(){
  const app   = document.getElementById('app');
  const stage = document.getElementById('coverStage');
  const cover = document.getElementById('cover');

  // Kick off the fade-out without losing display:flex (that would skip the transition)
  app.classList.add('closing');

  setTimeout(() => {
    // Fade is done — hide the app and restore the cover stage
    app.classList.remove('visible', 'closing');
    stage.classList.remove('hide');

    // Two rAFs: first lets the browser render the stage, second starts the swing
    requestAnimationFrame(() => requestAnimationFrame(() => {
      cover.classList.remove('opened'); // cover swings back to closed position
    }));
  }, 600); // matches the 0.6s opacity transition in CSS
}

document.getElementById('backToCoverBtn').addEventListener('click', closeBinder);

/* openBinderToPage — opens the binder (same animation as clicking the cover)
   but lands on a specific page index rather than page 0. */
function openBinderToPage(pageIndex){
  currentSpread = pageIndex;
  const cover = document.getElementById('cover');
  cover.classList.add('opened');
  setTimeout(() => {
    document.getElementById('coverStage').classList.add('hide');
    document.getElementById('app').classList.add('visible');
    loadBinder();
  }, 900);
}

/* initCoverSearch — wires up the search bar on the cover page so the user
   can find which page a card is on without opening the binder first. */
function initCoverSearch(){
  // Pre-load state from localStorage so search works before opening the binder
  const saved = loadLocal();
  if (saved) binderState = normalizeLoaded(saved);

  const input   = document.getElementById('coverSearchInput');
  const results = document.getElementById('coverSearchResults');
  if (!input || !results) return;

  const runSearch = () => {
    const q = input.value.trim().toLowerCase();
    results.innerHTML = '';
    results.classList.remove('has-results');
    if (q.length < 2) return;

    // Collect all matching cards across every page
    const hits = [];
    binderState.pages.forEach((page, pageIdx) => {
      page.forEach(card => {
        if (!card) return;
        const name = (card.name || card.customName || '').toLowerCase();
        const set  = (card.set?.name || card.customSet || '').toLowerCase();
        const num  = (card.number || '').toLowerCase();
        if (name.includes(q) || set.includes(q) || num === q)
          hits.push({ card, pageIdx });
      });
    });

    if (!hits.length){
      results.innerHTML = '<div class="csEmpty">No cards found in your binder</div>';
      results.classList.add('has-results');
      return;
    }

    // One result entry per matching card (cards on same page shown separately)
    hits.slice(0, 30).forEach(({ card, pageIdx }) => {
      const img  = card.images?.small || card.images?.large || card.customImageUrl || '';
      const name = card.name || card.customName || 'Unknown';
      const set  = card.set?.name || card.customSet || '';
      const num  = card.number || '';

      const div = document.createElement('div');
      div.className = 'csHit';
      div.innerHTML = `
        ${img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy">` : '<div style="width:34px;flex-shrink:0;"></div>'}
        <div class="cs-info">
          <div class="cs-name">${escapeHtml(name)}</div>
          <div class="cs-sub">${escapeHtml(set)}${num ? ' · #' + escapeHtml(num) : ''}</div>
        </div>
        <div class="cs-page">Page ${pageIdx + 1}</div>
      `;
      div.addEventListener('click', () => {
        input.value = '';
        results.innerHTML = '';
        results.classList.remove('has-results');
        openBinderToPage(pageIdx);
      });
      results.appendChild(div);
    });

    results.classList.add('has-results');
  };

  input.addEventListener('input', runSearch);
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ input.value = ''; results.innerHTML = ''; results.classList.remove('has-results'); }
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', e => {
    if (!document.getElementById('coverSearch')?.contains(e.target)){
      results.innerHTML = '';
      results.classList.remove('has-results');
    }
  }, true);
}

initCoverSearch();

/* ---------------------------------------------------------------------
   RENDERING — page flip
   We render ONE page at a time inside #pageHolder using a flip animation
   between the outgoing and incoming page face.
--------------------------------------------------------------------- */
/* applyCoverImage — swaps the binder cover between custom photo and the
   default Charizard gradient. Toggling the "custom-cover" class lets CSS
   handle showing/hiding #coverImg and restyling ::before / ::after. */
function applyCoverImage(dataUrl){
  const cover    = document.getElementById('cover');
  const img      = document.getElementById('coverImg');
  const removeBtn = document.getElementById('coverRemoveBtn');

  if (dataUrl){
    // Set the photo, enable cover-image CSS mode, show Remove button
    img.src = dataUrl;
    cover.classList.add('custom-cover');
    removeBtn.style.display = '';
  } else {
    // Clear photo, revert to gradient, hide Remove button
    img.src = '';
    cover.classList.remove('custom-cover');
    removeBtn.style.display = 'none';
  }
}

/* initCoverImage — called once on startup. Restores any saved cover image
   from binderState and wires up the Change / Remove buttons and the hidden
   file input that drives the image picker. */
function initCoverImage(){
  // Restore persisted cover photo on page load
  applyCoverImage(binderState.coverImage || null);

  // "Change Cover" button: stopPropagation so the click doesn't also
  // open the binder, then proxy to the hidden <input type="file">
  document.getElementById('coverChangeBtn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('coverFileInput').click();
  });

  // "Remove" button: clears the saved image and reverts to gradient
  document.getElementById('coverRemoveBtn').addEventListener('click', e => {
    e.stopPropagation();
    binderState.coverImage = null;
    persist();
    applyCoverImage(null);
  });

  // File picker: convert chosen image to a data URL, store it in state,
  // then apply it live. Reset input value so the same file can be
  // re-selected later (browser won't fire change otherwise).
  document.getElementById('coverFileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = await fileToDataUrl(file); // reuses scan helper — reads file as base64 data URL
    binderState.coverImage = url;
    persist();
    applyCoverImage(url);
    e.target.value = ''; // reset so same file can trigger change again
  });
}

/* =====================================================================
   GALLERY VIEW — flat scrollable grid of every card across all pages
   Toggled by the ⊞ Gallery button in the top bar.
   ===================================================================== */

let galleryMode   = false;  // true = gallery visible, false = binder visible
let galleryFilter = 'all';  // active status filter: 'all' | 'owned' | 'missing'
let gallerySort   = 'page'; // active sort: 'page' | 'name' | 'price'
let gallerySearch = '';     // current text in the name search box

/* toggleGallery — flips between binder page view and gallery view.
   Adding .gallery-mode to #app is what CSS uses to show/hide each section. */
function toggleGallery(){
  galleryMode = !galleryMode;
  const app = document.getElementById('app');
  const btn = document.getElementById('galleryBtn');

  if (galleryMode){
    app.classList.add('gallery-mode');
    btn.classList.add('active');
    btn.textContent = '⊟ Binder'; // label changes to show what clicking will go back to
    renderGallery();
  } else {
    app.classList.remove('gallery-mode');
    btn.classList.remove('active');
    btn.textContent = '⊞ Gallery';
    renderPage(currentSpread, null); // restore the binder page that was showing
  }
}

/* renderGallery — collects every filled slot from all pages, applies the
   active filter / search / sort, then stamps card tiles into #galleryGrid. */
function renderGallery(){
  // Collect all filled slots with their page + slot location
  const all = [];
  binderState.pages.forEach((page, pageIndex) => {
    page.forEach((slot, slotIndex) => {
      if (slot && slot.cardId){
        all.push({ slot, pageIndex, slotIndex });
      }
    });
  });

  // Apply owned/missing filter
  let visible = all.filter(({ slot }) => {
    if (galleryFilter === 'owned')   return  slot.owned;
    if (galleryFilter === 'missing') return !slot.owned;
    return true; // 'all' — no filter
  });

  // Apply name search (case-insensitive substring match)
  if (gallerySearch.trim()){
    const q = gallerySearch.trim().toLowerCase();
    visible = visible.filter(({ slot }) => slot.name.toLowerCase().includes(q));
  }

  // Sort results
  visible.sort((a, b) => {
    if (gallerySort === 'name')  return a.slot.name.localeCompare(b.slot.name);
    if (gallerySort === 'price'){
      // Cards with no price sort to the bottom
      const pa = a.slot.price ?? -1;
      const pb = b.slot.price ?? -1;
      return pb - pa; // highest price first
    }
    // Default 'page': use the natural page × slot position
    return (a.pageIndex * 9 + a.slotIndex) - (b.pageIndex * 9 + b.slotIndex);
  });

  // Update the count label
  document.getElementById('galleryCount').textContent =
    `${visible.length} card${visible.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';

  // Show empty state when nothing matches
  if (visible.length === 0){
    const empty = document.createElement('div');
    empty.className = 'galleryEmpty';
    empty.textContent = 'No cards match your filter.';
    grid.appendChild(empty);
    return;
  }

  // Build one tile per card
  visible.forEach(({ slot, pageIndex, slotIndex }) => {
    const tile = document.createElement('div');
    tile.className = 'galleryCard' + (slot.owned ? '' : ' missing-card');
    tile.dataset.pageIdx = pageIndex;
    tile.dataset.slotIdx = slotIndex;

    const priceText   = slot.price != null ? `$${Number(slot.price).toFixed(2)}` : '—';
    const statusClass = slot.owned ? 'owned' : 'missing';

    const ownedLabel = slot.owned ? 'Owned' : 'Missing';
    tile.innerHTML = `
      <div class="galleryImgWrap">
        <img src="${slot.image}" alt="${escapeHtml(slot.name)}" loading="lazy">
      </div>
      <div class="galleryCardInfo">
        <div class="galleryCardName">${escapeHtml(slot.name)}</div>
        <div class="galleryCardSet">${escapeHtml(slot.set || '')}</div>
        <div class="galleryCardMeta">
          <span class="galleryCardStatus ${statusClass}"></span>
          <span class="galleryCardOwned">${ownedLabel}</span>
          <span class="galleryCardPage">Pg ${pageIndex + 1}</span>
        </div>
        <div class="galleryCardPrice">${priceText}</div>
      </div>`;

    tile.addEventListener('click', () => openCardViewer(pageIndex, slotIndex));
    grid.appendChild(tile);
  });

  // Add fog overlays to all tiles if fog mode is active
  if (fogMode) setTimeout(initGalleryFogCanvases, 0);

  // Wire the roller active-card highlight after layout settles
  setTimeout(() => initGalleryRoller(grid), 0);
}

/* initGalleryRoller — marks the card closest to the vertical centre of
   #galleryGrid as .roller-active (scale-up + full opacity). Called once
   after renderGallery and on every scroll tick via requestAnimationFrame. */
let _rollerRaf = false;
function initGalleryRoller(grid){
  if (!grid) return;

  function markActive(){
    const centre = grid.scrollTop + grid.clientHeight / 2;
    let best = null, bestDist = Infinity;
    grid.querySelectorAll('.galleryCard').forEach(card => {
      card.classList.remove('roller-active');
      const dist = Math.abs((card.offsetTop + card.offsetHeight / 2) - centre);
      if (dist < bestDist){ bestDist = dist; best = card; }
    });
    if (best) best.classList.add('roller-active');
    _rollerRaf = false;
  }

  // Initial highlight
  markActive();

  // Re-highlight on scroll using RAF so we don't block the thread
  grid.addEventListener('scroll', () => {
    if (!_rollerRaf){
      _rollerRaf = true;
      requestAnimationFrame(markActive);
    }
  }, { passive: true });
}

/* =====================================================================
   FOG REVEAL MODE
   Cards are covered by a frosted-glass canvas overlay. Dragging over
   a card erases the fog pixels (destination-out compositing) to reveal
   the card underneath — like wiping condensation off a window.
   Fog resets on every page navigation since the DOM is rebuilt.
   ===================================================================== */

/* =====================================================================
   FOG REVEAL COOLDOWN
   ===================================================================== */

/* canReveal — returns {ok:true} when a reveal is allowed, or
   {ok:false, nextTime:ms} when the cooldown has not yet expired. */
function canReveal(){
  const mode = binderState.revealCooldown || 'none';
  if (mode === 'none') return { ok: true };
  const last = binderState.lastRevealTime;
  if (!last) return { ok: true };
  const now = Date.now();
  if (mode === 'daily'){
    const lastDate = new Date(last).toDateString();
    if (lastDate !== new Date(now).toDateString()) return { ok: true };
    const tomorrow = new Date(); tomorrow.setHours(24, 0, 0, 0);
    return { ok: false, nextTime: tomorrow.getTime() };
  }
  const ms = { '1h': 3600000, '6h': 21600000, '24h': 86400000 }[mode] || 0;
  const nextTime = last + ms;
  return now >= nextTime ? { ok: true } : { ok: false, nextTime };
}

function formatRevealWait(nextTime){
  const diff = Math.max(0, nextTime - Date.now());
  const h = Math.floor(diff / 3600000);
  const m = Math.ceil((diff % 3600000) / 60000);
  if (h > 0 && m > 0) return `${h}h ${m}m`;
  if (h > 0) return `${h}h`;
  return `${m}m`;
}

function recordReveal(){
  binderState.lastRevealTime = Date.now();
  persist();
}

let fogMode = false; // true = fog canvases are added to all filled pockets

/* drawFog — paints a layered frost effect onto a canvas element.
   Combines a solid blue-grey base, a dark vignette, random frost
   specks, and soft cloudy blobs for a convincing condensation look. */
function drawFog(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  // Solid semi-opaque base — cool blue-grey like real condensation on glass
  ctx.fillStyle = 'rgba(185,208,228,0.97)';
  ctx.fillRect(0, 0, w, h);

  // Radial vignette — lighter centre, darker edges for depth
  const vig = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h) * 0.72);
  vig.addColorStop(0, 'rgba(225,240,252,0)');
  vig.addColorStop(1, 'rgba(90,125,158,0.52)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, w, h);

  // Fine frost specks — hundreds of tiny white dots give a crystalline texture
  for (let i = 0; i < 520; i++){
    const x = Math.random() * w;
    const y = Math.random() * h;
    ctx.beginPath();
    ctx.arc(x, y, Math.random() * 2.2 + 0.3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${(Math.random() * 0.18 + 0.04).toFixed(2)})`;
    ctx.fill();
  }

  // Soft cloudy blobs — larger diffuse spots break up the uniformity
  for (let i = 0; i < 14; i++){
    const x = Math.random() * w, y = Math.random() * h;
    const r = Math.random() * 22 + 8;
    const blob = ctx.createRadialGradient(x, y, 0, x, y, r);
    blob.addColorStop(0, 'rgba(255,255,255,0.13)');
    blob.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = blob;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

/* attachWipeListeners — wires mouse + touch events to a fog canvas so
   the user can drag to erase fog or tap to trigger onTap.
   onTap defaults to opening the detail panel; pass a custom fn to override
   (e.g. the click-to-fully-reveal behaviour used in binder + gallery).
   When a reveal cooldown is configured, ALL interaction is blocked until
   the cooldown expires — a toast shows the remaining wait time. */
function attachWipeListeners(canvas, onTap){
  const pageIndex = parseInt(canvas.dataset.pageIdx);
  const slotIndex = parseInt(canvas.dataset.slotIdx);
  const handleTap = onTap || (() => openDetailPanel(pageIndex, slotIndex));

  const toCanvas = (clientX, clientY) => {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) * (canvas.width  / r.width),
      y: (clientY - r.top)  * (canvas.height / r.height)
    };
  };

  const erase = (x, y) => {
    const ctx = canvas.getContext('2d');
    const R   = Math.max(canvas.width, canvas.height) * 0.23;
    ctx.globalCompositeOperation = 'destination-out';
    const g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0,    'rgba(0,0,0,1)');
    g.addColorStop(0.55, 'rgba(0,0,0,0.85)');
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  };

  // `active` tracks whether the current pointer-down session is allowed to wipe.
  // When a cooldown is active, active=false so mousemove/touchmove are no-ops.
  let moved = false, startX = 0, startY = 0, active = false;

  canvas.addEventListener('mousedown', e => {
    const check = canReveal();
    if (!check.ok){
      toast(`⏳ Next reveal in ${formatRevealWait(check.nextTime)}`);
      return; // active stays false — move and up events are ignored
    }
    active = true;
    moved = false; startX = e.clientX; startY = e.clientY;
    erase(...Object.values(toCanvas(e.clientX, e.clientY)));
  });
  canvas.addEventListener('mousemove', e => {
    if (!e.buttons || !active) return;
    if (Math.hypot(e.clientX - startX, e.clientY - startY) > 4) moved = true;
    erase(...Object.values(toCanvas(e.clientX, e.clientY)));
  });
  canvas.addEventListener('mouseup', () => {
    if (active && !moved) handleTap();
    moved = false; active = false;
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const check = canReveal();
    if (!check.ok){
      toast(`⏳ Next reveal in ${formatRevealWait(check.nextTime)}`);
      return;
    }
    active = true;
    moved = false;
    const t = e.touches[0]; startX = t.clientX; startY = t.clientY;
    erase(...Object.values(toCanvas(t.clientX, t.clientY)));
  }, {passive: false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!active) return;
    moved = true;
    const t = e.touches[0];
    erase(...Object.values(toCanvas(t.clientX, t.clientY)));
  }, {passive: false});
  canvas.addEventListener('touchend', () => {
    if (active && !moved) handleTap();
    moved = false; active = false;
  });
}

/* initFogCanvases — called via setTimeout after a page face is inserted into
   the DOM, so CSS layout has settled and offsetWidth/Height are correct.
   Sizes every fog canvas in pixels, draws the initial frost, then wires wipes.
   Tap clears + removes the canvas so the next click reaches the pocket. */
function initFogCanvases(face){
  face.querySelectorAll('.fogCanvas').forEach(canvas => {
    const pocket  = canvas.parentElement;
    canvas.width  = pocket.offsetWidth  || 100;
    canvas.height = pocket.offsetHeight || 140;
    drawFog(canvas);
    const clearFog = () => {
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      canvas.remove();
      recordReveal();
    };
    attachWipeListeners(canvas, clearFog);
  });
}

/* initGalleryFogCanvases — adds fog canvases to every gallery tile's image
   wrapper that doesn't already have one. Safe to call after re-reveals since
   it skips wraps that already have a canvas. */
function initGalleryFogCanvases(){
  document.querySelectorAll('.galleryImgWrap').forEach(wrap => {
    if (wrap.querySelector('.fogCanvas')) return;
    const tile    = wrap.closest('.galleryCard');
    const pageIdx = parseInt(tile.dataset.pageIdx);
    const slotIdx = parseInt(tile.dataset.slotIdx);
    const canvas  = document.createElement('canvas');
    canvas.className      = 'fogCanvas';
    canvas.dataset.pageIdx = pageIdx;
    canvas.dataset.slotIdx = slotIdx;
    wrap.appendChild(canvas);
    canvas.width  = wrap.offsetWidth  || 120;
    canvas.height = wrap.offsetHeight || 160;
    drawFog(canvas);
    const clearFog = () => {
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      canvas.remove();
      recordReveal();
    };
    attachWipeListeners(canvas, clearFog);
  });
}

/* toggleFogMode — flips fog on/off.
   In binder mode: re-renders the current page so pockets gain/lose fog.
   In gallery mode: adds or removes fog canvases from all tiles. */
function toggleFogMode(){
  fogMode = !fogMode;
  const btn      = document.getElementById('fogBtn');
  const resetBtn = document.getElementById('resetFogBtn');
  btn.classList.toggle('active', fogMode);
  btn.textContent        = fogMode ? '🌫 Fog On' : '🌫 Fog';
  resetBtn.style.display = fogMode ? ''         : 'none';
  if (galleryMode){
    if (fogMode) setTimeout(initGalleryFogCanvases, 0);
    else document.querySelectorAll('#galleryGrid .fogCanvas').forEach(c => c.remove());
  } else {
    renderPage(currentSpread, null); // rebuild so pockets gain/lose fog overlay
  }
}

/* resetFog — redraws fresh fog on every visible canvas, and in gallery mode
   also re-adds fog to any tiles the user already revealed by clicking. */
function resetFog(){
  document.querySelectorAll('.fogCanvas').forEach(canvas => {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawFog(canvas);
  });
  if (galleryMode) setTimeout(initGalleryFogCanvases, 0);
}

/* initFogControls — wires the Fog and Reset buttons once on startup. */
function initFogControls(){
  document.getElementById('fogBtn').addEventListener('click', toggleFogMode);
  document.getElementById('resetFogBtn').addEventListener('click', resetFog);
}

/* =====================================================================
   LANDSCAPE SPREAD MODE
   Shows two pages side-by-side when a phone is in landscape orientation.
   Includes a 3-D CSS page-turn animation on navigation.
   ===================================================================== */

let spreadMode  = false; // true while landscape spread is active
let spreadIndex = 0;     // which spread is shown (0 → pages 1+2, 1 → pages 3+4 …)
let lsFlipping  = false; // guards against overlapping flip animations

function checkSpreadMode(){
  // "Mobile landscape" = landscape orientation with a short screen height
  // (height < 520 excludes desktops/tablets in landscape)
  const inGallery  = document.getElementById('app').classList.contains('gallery-mode');
  const wantSpread = !inGallery && window.innerWidth > window.innerHeight && window.innerHeight < 520;
  if (wantSpread === spreadMode) return;
  spreadMode = wantSpread;

  const app = document.getElementById('app');
  if (spreadMode){
    app.classList.add('landscape-mode');
    // Snap currentSpread to an even page index, then compute spread index
    if (currentSpread % 2 !== 0) currentSpread = Math.max(0, currentSpread - 1);
    spreadIndex = Math.floor(currentSpread / 2);
    renderSpread();
  } else {
    app.classList.remove('landscape-mode');
    currentSpread = spreadIndex * 2;
    renderPage(currentSpread, null);
    updateCounter();
  }
}

/* buildSpreadContent — fills a .lsPageInner container with a page's pockets */
function buildSpreadContent(container, pageIndex){
  container.innerHTML = '';
  const maxPages = binderState.pages.length;

  const hdr = document.createElement('div');
  hdr.className = 'lsPageHeader';
  hdr.textContent = (pageIndex < maxPages) ? `— Page ${pageIndex + 1} —` : '';
  container.appendChild(hdr);

  if (pageIndex < maxPages){
    const grid = document.createElement('div');
    grid.className = 'grid3x3 lsGrid';
    const page = binderState.pages[pageIndex] || new Array(SLOTS_PER_PAGE).fill(null);
    for (let s = 0; s < SLOTS_PER_PAGE; s++) grid.appendChild(buildPocketEl(pageIndex, s, page[s]));
    container.appendChild(grid);
  }
}

/* updateSpreadPage — refreshes only the panel currently showing pageIndex */
function updateSpreadPage(pageIndex){
  const li = spreadIndex * 2, ri = li + 1;
  if (pageIndex === li) buildSpreadContent(document.getElementById('lsLeftInner'), li);
  if (pageIndex === ri) buildSpreadContent(document.getElementById('lsRightInner'), ri);
}

function renderSpread(){
  const li = spreadIndex * 2, ri = li + 1;
  buildSpreadContent(document.getElementById('lsLeftInner'),  li);
  buildSpreadContent(document.getElementById('lsRightInner'), ri);
  updateSpreadNav();
  if (fogMode) setTimeout(() => initFogCanvases(document.getElementById('landscapeBook')), 60);
  triggerPriceFetches(li);
  if (ri < binderState.pages.length) triggerPriceFetches(ri);
}

function updateSpreadNav(){
  const maxSpreads = Math.ceil(binderState.pages.length / 2);
  const endPage    = Math.min(spreadIndex * 2 + 2, binderState.pages.length);
  document.getElementById('lsPrevBtn').disabled = (spreadIndex <= 0);
  document.getElementById('lsNextBtn').disabled = (spreadIndex >= maxSpreads - 1);
  document.getElementById('lsPageLabel').textContent =
    `Pg ${spreadIndex * 2 + 1}–${endPage} / ${binderState.pages.length}`;
}

/* flipSpread — 3-D page-turn animation, then swaps content.
   dir = 1  → forward  (right page flips left)
   dir = -1 → backward (left page flips right)  */
function flipSpread(dir){
  if (lsFlipping) return;
  const newIdx     = spreadIndex + dir;
  const maxSpreads = Math.ceil(binderState.pages.length / 2);
  if (newIdx < 0 || newIdx >= maxSpreads) return;

  lsFlipping = true;
  const flipper   = document.getElementById('lsFlipper');
  const flipFront = document.getElementById('lsFlipFront');
  const flipBack  = document.getElementById('lsFlipBack');
  const lsLeft    = document.getElementById('lsLeftInner');
  const lsRight   = document.getElementById('lsRightInner');
  const book      = document.getElementById('landscapeBook');

  const li  = spreadIndex * 2,  ri  = li + 1;
  const nli = newIdx * 2,       nri = nli + 1;

  // Disable nav buttons during animation
  document.getElementById('lsPrevBtn').disabled = true;
  document.getElementById('lsNextBtn').disabled = true;

  if (dir === 1){
    // Forward: right page flips to the left.
    // flipFront = current right page, flipBack = next left page.
    // lsRight swapped to next right now (hidden behind flipper initially).
    buildSpreadContent(flipFront, ri);
    buildSpreadContent(flipBack,  nli);
    buildSpreadContent(lsRight,   nri);
    // lsLeft stays showing the current left page.

    flipper.className        = 'flip-right';
    flipper.style.transition = 'none';
    flipper.style.transform  = 'rotateY(0deg)';
    // Show via visibility (not display) — iOS Safari needs the element to stay in
    // the layout tree between state changes or the 3-D transform won't paint.
    flipper.style.visibility    = 'visible';
    flipper.style.pointerEvents = 'auto';
    // Double rAF is more reliable than offsetWidth for forcing a style recalc on iOS.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      flipper.style.transition = 'transform .6s cubic-bezier(0.645,0.045,0.355,1.000)';
      flipper.style.transform  = 'rotateY(-180deg)';
    }));

  } else {
    // Backward: left page flips to the right.
    // flipFront = current left page, flipBack = previous right page.
    // lsLeft swapped to prev left now (hidden behind flipper initially).
    buildSpreadContent(flipFront, li);
    buildSpreadContent(flipBack,  nri);
    buildSpreadContent(lsLeft,    nli);
    // lsRight stays showing the current right page.

    flipper.className        = 'flip-left';
    flipper.style.transition = 'none';
    flipper.style.transform  = 'rotateY(0deg)';
    flipper.style.visibility    = 'visible';
    flipper.style.pointerEvents = 'auto';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      flipper.style.transition = 'transform .6s cubic-bezier(0.645,0.045,0.355,1.000)';
      flipper.style.transform  = 'rotateY(180deg)';
    }));
  }

  const finish = () => {
    // Swap the remaining static panel to the new page
    if (dir === 1) buildSpreadContent(lsLeft,  nli);
    else           buildSpreadContent(lsRight, nri);
    // Hide flipper and reset state
    flipper.style.transition    = 'none';
    flipper.style.visibility    = 'hidden';
    flipper.style.pointerEvents = 'none';
    flipper.className        = '';
    spreadIndex    = newIdx;
    currentSpread  = spreadIndex * 2;
    lsFlipping     = false;
    updateSpreadNav();
    triggerPriceFetches(nli);
    if (nri < binderState.pages.length) triggerPriceFetches(nri);
    if (fogMode) setTimeout(() => initFogCanvases(book), 60);
  };

  // addEventListener with {once:true} is more reliable than ontransitionend on iOS
  // (ontransitionend can silently fail if the element was hidden mid-transition).
  flipper.addEventListener('transitionend', finish, { once: true });
  // Safety fallback — fires if transitionend never arrives (e.g. reduced-motion)
  setTimeout(() => { if (lsFlipping) finish(); }, 900);
}

/* initLandscapeMode — wires nav buttons, swipe gestures, and orientation events.
   Called once from init(). */
function initLandscapeMode(){
  document.getElementById('lsPrevBtn').addEventListener('click', () => flipSpread(-1));
  document.getElementById('lsNextBtn').addEventListener('click', () => flipSpread(1));

  // Touch swipe on the book
  let tsX = 0, tsY = 0;
  const book = document.getElementById('landscapeBook');
  book.addEventListener('touchstart', e => {
    tsX = e.touches[0].clientX;
    tsY = e.touches[0].clientY;
  }, { passive: true });
  book.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tsX;
    const dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 40){
      if (dx < 0) flipSpread(1);   // swipe left  → next spread
      else         flipSpread(-1); // swipe right → prev spread
    }
  }, { passive: true });

  // React to orientation changes and window resizes
  window.addEventListener('resize',            checkSpreadMode);
  // iOS needs up to 400 ms after orientationchange for window.innerWidth/Height to settle
  window.addEventListener('orientationchange', () => setTimeout(checkSpreadMode, 400));

  // Initial check — delayed so binderState is populated first
  setTimeout(checkSpreadMode, 260);
}

/* initGallery — called once on startup to wire up the toggle button and
   all the filter / sort / search controls in the gallery toolbar. */
function initGallery(){
  document.getElementById('galleryBtn').addEventListener('click', toggleGallery);

  // Filter chips: clicking one activates it and deactivates the others
  document.querySelectorAll('.galleryFilterChip').forEach(chip => {
    chip.addEventListener('click', () => {
      galleryFilter = chip.dataset.filter;
      document.querySelectorAll('.galleryFilterChip')
        .forEach(c => c.classList.toggle('active', c === chip));
      if (galleryMode) renderGallery();
    });
  });

  // Sort dropdown
  document.getElementById('gallerySortSelect').addEventListener('change', e => {
    gallerySort = e.target.value;
    if (galleryMode) renderGallery();
  });

  // Name search — debounced 200 ms so it doesn't re-render on every keystroke
  let searchTimer;
  document.getElementById('gallerySearch').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      gallerySearch = e.target.value;
      if (galleryMode) renderGallery();
    }, 200);
  });
}

function renderAll(){
  renderPage(currentSpread, null);
  updateCounter();
  updateSummary();
  // Keep gallery in sync whenever state changes (e.g. card added, detail saved)
  if (galleryMode) renderGallery();
}

function updateCounter(){
  const total = binderState.pages.length;
  document.getElementById('pageCounter').textContent = `Page ${currentSpread+1} of ${total}`;
  document.getElementById('prevBtn').disabled = currentSpread <= 0;
  document.getElementById('nextBtn').disabled = currentSpread >= total - 1;
  // page control buttons
  const moveL = document.getElementById('pageMoveL');
  const moveR = document.getElementById('pageMoveR');
  const remBtn = document.getElementById('pageRemove');
  if (moveL) moveL.disabled = currentSpread <= 0;
  if (moveR) moveR.disabled = currentSpread >= total - 1;
  if (remBtn) remBtn.disabled = total <= 1;
}

function updateSummary(){
  let owned = 0, missing = 0;
  binderState.pages.forEach(page => page.forEach(slot => {
    if (slot){
      if (slot.owned) owned++; else missing++;
    }
  }));
  document.getElementById('ownedCount').textContent = owned;
  document.getElementById('missingCount').textContent = missing;
}

function buildPageFaceEl(pageIndex){
  const face = document.createElement('div');
  face.className = 'pageFace';
  const header = document.createElement('div');
  header.className = 'pageHeader';
  const labelSpan = document.createElement('span');
  labelSpan.className = 'pageHeaderLabel';
  labelSpan.textContent = `— Page ${pageIndex+1} —`;
  const scanBtn = document.createElement('button');
  scanBtn.className = 'scanPageBtn';
  scanBtn.textContent = '📷 Scan Card';
  // page-level scan: no slot pre-selected — show slot picker after identification
  scanBtn.addEventListener('click', (e) => { e.stopPropagation(); openSingleCardScan(pageIndex, -1); });
  header.appendChild(labelSpan);
  header.appendChild(scanBtn);
  const grid = document.createElement('div');
  grid.className = 'grid3x3';

  const page = binderState.pages[pageIndex] || new Array(SLOTS_PER_PAGE).fill(null);
  for (let s = 0; s < SLOTS_PER_PAGE; s++){
    grid.appendChild(buildPocketEl(pageIndex, s, page[s]));
  }
  face.appendChild(header);
  face.appendChild(grid);
  // After layout settles: fetch missing prices + size/draw any fog canvases
  setTimeout(() => {
    triggerPriceFetches(pageIndex);
    if (fogMode) initFogCanvases(face); // must run after layout so offsetWidth is non-zero
  }, 50);
  return face;
}

function buildPocketEl(pageIndex, slotIndex, slot){
  const pocket = document.createElement('div');
  pocket.id = `pocket-${pageIndex}-${slotIndex}`;
  pocket.className = 'pocket' + (slot ? ' filled' : '') + (slot && !slot.owned ? ' missing' : '');
  pocket.addEventListener('click', () => onPocketClick(pageIndex, slotIndex));

  if (slot){
    const img = document.createElement('img');
    img.src = slot.image || '';
    img.alt = slot.name || 'card';
    pocket.appendChild(img);

    const dot = document.createElement('div');
    dot.className = 'ownedDot ' + (slot.owned ? 'owned' : 'missing');
    pocket.appendChild(dot);

    if (slot.quantity && slot.quantity > 1){
      const badge = document.createElement('div');
      badge.className = 'qtyBadge';
      badge.textContent = 'x' + slot.quantity;
      pocket.appendChild(badge);
    }

    const priceBadge = document.createElement('div');
    if (slot.price != null){
      priceBadge.className = 'priceBadge';
      priceBadge.textContent = `$${Number(slot.price).toFixed(2)}`;
    } else {
      priceBadge.className = 'priceBadge loading';
      priceBadge.textContent = '…';
    }
    pocket.appendChild(priceBadge);

    // Fog canvas — added on top when fog mode is active; sized + drawn later
    // in initFogCanvases() once the element is in the DOM and has real dimensions
    if (fogMode){
      const fog = document.createElement('canvas');
      fog.className = 'fogCanvas';
      fog.dataset.pageIdx = pageIndex;
      fog.dataset.slotIdx = slotIndex;
      pocket.appendChild(fog);
    }
  } else {
    const plus = document.createElement('div');
    plus.className = 'plus';
    plus.textContent = '+';
    pocket.appendChild(plus);
  }
  return pocket;
}

/* getMarketPrice — picks the best single market price from the tcgplayer
   prices object. Prefers holofoil variants first (usually the most
   recognised value), then falls back through normal and older print types.
   Returns null if the card has no TCGPlayer pricing at all. */
function getMarketPrice(tcgplayer){
  if (!tcgplayer?.prices) return null;

  // Priority order: holofoil variants tend to be the "main" price for
  // most cards; normal comes after because base set normals exist too.
  const order = ['holofoil','reverseHolofoil','normal','1stEditionHolofoil','unlimitedHolofoil'];
  for (const key of order){
    const p = tcgplayer.prices[key];
    if (p?.market != null) return p.market;
  }

  // Fallback: iterate whatever variants exist and take the first with a market price
  for (const p of Object.values(tcgplayer.prices)){
    if (p?.market != null) return p.market;
  }
  return null;
}

/* fetchAndCachePrice — fetches live TCGPlayer pricing for a single binder
   slot via the Pokémon TCG API, then writes the result back into binderState
   and updates the price badge in the DOM without re-rendering the whole page.
   Called lazily when a page loads and a slot is missing its price. */
async function fetchAndCachePrice(pageIndex, slotIndex){
  const slot = binderState.pages[pageIndex]?.[slotIndex];
  if (!slot?.cardId) return; // nothing to fetch for an empty slot

  // Grab the badge element now so we can update it after the fetch completes
  const badgeEl = document.getElementById(`pocket-${pageIndex}-${slotIndex}`)?.querySelector('.priceBadge');

  try {
    const apiKey = binderState.apiKey || '';
    // API key is optional — unauthenticated requests still work but are rate-limited
    const headers = apiKey ? {'X-Api-Key': apiKey} : {};

    const res = await fetch(`https://api.pokemontcg.io/v2/cards/${encodeURIComponent(slot.cardId)}`, {headers});
    if (!res.ok) throw new Error(res.status);

    const {data} = await res.json();

    // Store the resolved market price and full variant breakdown on the slot
    const price = getMarketPrice(data.tcgplayer);
    slot.price        = price;
    slot.priceDetails = data.tcgplayer?.prices || null; // full breakdown used in detail panel

    persist(); // save updated price to Firebase / localStorage

    // Update the badge in the grid without rebuilding the whole page
    if (badgeEl){
      badgeEl.classList.remove('loading');
      badgeEl.textContent = price != null ? `$${price.toFixed(2)}` : '—';
    }
  } catch(e){
    // On any error (network, 404, rate-limit) just show a dash — non-fatal
    if (badgeEl){ badgeEl.classList.remove('loading'); badgeEl.textContent = '—'; }
  }
}

/* triggerPriceFetches — called after a page renders. Loops every filled slot
   on that page and kicks off a background price fetch for any slot that
   doesn't already have a cached price. Fires are independent/parallel. */
function triggerPriceFetches(pageIndex){
  const page = binderState.pages[pageIndex] || [];
  page.forEach((slot, slotIndex) => {
    // Only fetch if slot has a card but hasn't been priced yet
    if (slot && slot.cardId && slot.price == null){
      fetchAndCachePrice(pageIndex, slotIndex);
    }
  });
}

let isFlipping = false;
let flipCleanupTimer = null;

function renderPage(pageIndex, direction){
  const holder = document.getElementById('pageHolder');
  const newFace = buildPageFaceEl(pageIndex);

  if (!direction){
    clearTimeout(flipCleanupTimer);
    isFlipping = false;
    holder.innerHTML = '';
    holder.appendChild(newFace);
    // Keep landscape spread in sync when data changes in portrait mode
    if (spreadMode && !lsFlipping) updateSpreadPage(pageIndex);
    return;
  }

  // cancel any in-flight flip so old faces never stack up / overlap
  clearTimeout(flipCleanupTimer);
  const oldFaces = Array.from(holder.querySelectorAll('.pageFace'));
  isFlipping = true;

  newFace.style.transform = direction === 'next' ? 'rotateY(90deg)' : 'rotateY(-90deg)';
  newFace.style.opacity = '0';
  holder.appendChild(newFace);

  requestAnimationFrame(() => {
    oldFaces.forEach(oldFace => {
      oldFace.style.transition = 'transform .45s ease-in, opacity .45s ease-in';
      oldFace.style.transform = direction === 'next' ? 'rotateY(-90deg)' : 'rotateY(90deg)';
      oldFace.style.opacity = '0';
    });
    newFace.style.transition = 'transform .45s ease-out .15s, opacity .3s ease-out .2s';
    newFace.style.transform = 'rotateY(0deg)';
    newFace.style.opacity = '1';
  });

  flipCleanupTimer = setTimeout(() => {
    oldFaces.forEach(oldFace => {
      if (oldFace.parentNode) oldFace.parentNode.removeChild(oldFace);
    });
    isFlipping = false;
  }, 480);
}

function goNext(){
  if (isFlipping || currentSpread >= binderState.pages.length - 1) return;
  currentSpread++;
  renderPage(currentSpread, 'next');
  updateCounter();
}
function goPrev(){
  if (isFlipping || currentSpread <= 0) return;
  currentSpread--;
  renderPage(currentSpread, 'prev');
  updateCounter();
}

document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('prevBtn').addEventListener('click', goPrev);

// keyboard arrows
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('app').classList.contains('visible')) return;
  if (document.getElementById('overlay').classList.contains('visible')) return;
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});

// touch swipe
let touchStartX = null;
document.getElementById('binderWrap').addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('binderWrap').addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50){
    if (dx < 0) goNext(); else goPrev();
  }
  touchStartX = null;
});

/* =====================================================================
   CARD VIEWER LIGHTBOX
   Shown when a filled pocket is tapped. Displays the card image large
   with name / set / price below. An "Edit card" button opens the full
   edit form. Tap the backdrop or × to dismiss.
   ===================================================================== */

let cvSlotRef = null; // { pageIndex, slotIndex } of the currently viewed card

function openCardViewer(pageIndex, slotIndex){
  const slot = (binderState.pages[pageIndex] || [])[slotIndex];
  if (!slot) return;
  cvSlotRef = { pageIndex, slotIndex };

  document.getElementById('cvImg').src = slot.image || '';
  document.getElementById('cvImg').alt = slot.name  || '';
  document.getElementById('cvCardName').textContent = slot.name || '';
  document.getElementById('cvCardSet').textContent  = slot.set  || '';

  const prEl = document.getElementById('cvCardPrice');
  prEl.textContent = (slot.price != null) ? `$${Number(slot.price).toFixed(2)}` : '—';

  const owEl = document.getElementById('cvCardOwned');
  if (slot.owned !== false){
    owEl.textContent = 'Owned'; owEl.className = 'owned';
  } else {
    owEl.textContent = 'Missing'; owEl.className = 'missing';
  }

  // Wire price-search buttons to this specific card each time the viewer opens
  const cardName = slot.name || '';
  document.getElementById('cvEbayBtn').onclick = () => {
    const q = encodeURIComponent(cardName + ' kayou my little pony');
    window.open(`https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1`, '_blank');
  };
  document.getElementById('cvWaifuBtn').onclick = () => {
    window.open(`https://waifucards.app/sets/mlp?lang=en`, '_blank');
  };

  const v = document.getElementById('cardViewer');
  v.style.display = 'flex';
  requestAnimationFrame(() => v.classList.add('cv-open'));

  // If price is unknown, kick off a background fetch and update when done
  if (slot.price == null){
    fetchAndCachePrice(pageIndex, slotIndex).then(() => {
      const ref = cvSlotRef;
      if (!ref || ref.pageIndex !== pageIndex || ref.slotIndex !== slotIndex) return;
      const updated = (binderState.pages[pageIndex] || [])[slotIndex];
      if (updated?.price != null)
        document.getElementById('cvCardPrice').textContent = `$${Number(updated.price).toFixed(2)}`;
    });
  }
}

/* openImageCropper — canvas-based pan/zoom editor for a photo before saving to a slot.
   Draws the image on a card-shaped canvas; user drags to pan and pinches/scrolls to zoom.
   Image always fills the canvas (no black bars). Calls onConfirm(dataUrl) or onCancel(). */
function openImageCropper(imageDataUrl, onConfirm, onCancel){
  const CW = 260, CH = 364; // card aspect ratio 5:7 at display resolution

  showOverlay(`
    <h2 style="margin-bottom:4px;">Crop & Center</h2>
    <p style="font-size:12px;color:#888;margin:0 0 8px 0;">Drag to move · Pinch or slide to zoom</p>
    <canvas id="cropCanvas" width="${CW}" height="${CH}"
      style="display:block;border-radius:10px;border:2px solid #ddd;touch-action:none;
             cursor:grab;background:#222;max-width:100%;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,0.25);">
    </canvas>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
      <span style="font-size:13px;">−</span>
      <input type="range" id="zoomSlider" min="100" max="400" step="1" value="100"
        style="flex:1;height:4px;accent-color:#e83;">
      <span style="font-size:13px;">+</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="secondary" id="cropResetBtn" style="flex:1;">↺ Fit</button>
      <button class="primary" id="cropConfirmBtn" style="flex:2;">✓ Use This</button>
    </div>
    <div class="closeRow" style="margin-top:8px;">
      <button class="secondary" id="cropCancelBtn">← Cancel</button>
    </div>
  `);

  const canvas = document.getElementById('cropCanvas');
  const ctx    = canvas.getContext('2d');
  const img    = new Image();
  let scale = 1, minScale = 1;
  let ox = 0, oy = 0; // image top-left offset on the canvas

  function clamp(){
    // Prevent exposing canvas background — image must always cover the full canvas
    ox = Math.min(0, Math.max(CW - img.width  * scale, ox));
    oy = Math.min(0, Math.max(CH - img.height * scale, oy));
  }

  function draw(){
    ctx.clearRect(0, 0, CW, CH);
    ctx.drawImage(img, ox, oy, img.width * scale, img.height * scale);
  }

  function applyScale(newScale, pivotX, pivotY){
    newScale = Math.max(minScale, Math.min(minScale * 4, newScale));
    const ratio = newScale / scale;
    ox = pivotX + (ox - pivotX) * ratio;
    oy = pivotY + (oy - pivotY) * ratio;
    scale = newScale;
    clamp();
    draw();
    document.getElementById('zoomSlider').value = Math.round(scale / minScale * 100);
  }

  function resetFit(){
    minScale = Math.max(CW / img.width, CH / img.height);
    scale    = minScale;
    ox = (CW - img.width  * scale) / 2;
    oy = (CH - img.height * scale) / 2;
    clamp();
    draw();
    const sl = document.getElementById('zoomSlider');
    if (sl) sl.value = 100;
  }

  img.onload = resetFit;
  img.src    = imageDataUrl;

  // Zoom slider
  document.getElementById('zoomSlider').addEventListener('input', (e) => {
    applyScale(minScale * (parseInt(e.target.value) / 100), CW / 2, CH / 2);
  });

  document.getElementById('cropResetBtn').addEventListener('click', resetFit);

  // --- Mouse pan ---
  let dragging = false, lastMX = 0, lastMY = 0;
  canvas.addEventListener('mousedown', (e) => {
    dragging = true; lastMX = e.clientX; lastMY = e.clientY;
    canvas.style.cursor = 'grabbing'; e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    ox += e.clientX - lastMX; oy += e.clientY - lastMY;
    lastMX = e.clientX; lastMY = e.clientY;
    clamp(); draw();
  });
  window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'grab'; });

  // --- Scroll wheel zoom ---
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    applyScale(scale * (e.deltaY < 0 ? 1.1 : 0.9),
               e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });

  // --- Touch pan + pinch ---
  let lastTouches = [];
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    lastTouches = Array.from(e.touches);
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touches = Array.from(e.touches);
    const rect    = canvas.getBoundingClientRect();

    if (touches.length === 1 && lastTouches.length >= 1){
      ox += touches[0].clientX - lastTouches[0].clientX;
      oy += touches[0].clientY - lastTouches[0].clientY;
      clamp(); draw();
    } else if (touches.length === 2 && lastTouches.length >= 2){
      const prevD = Math.hypot(lastTouches[0].clientX - lastTouches[1].clientX,
                               lastTouches[0].clientY - lastTouches[1].clientY);
      const newD  = Math.hypot(touches[0].clientX - touches[1].clientX,
                               touches[0].clientY - touches[1].clientY);
      const midX  = (touches[0].clientX + touches[1].clientX) / 2 - rect.left;
      const midY  = (touches[0].clientY + touches[1].clientY) / 2 - rect.top;
      const pmidX = (lastTouches[0].clientX + lastTouches[1].clientX) / 2 - rect.left;
      const pmidY = (lastTouches[0].clientY + lastTouches[1].clientY) / 2 - rect.top;
      // Pan via midpoint movement first, then scale around new midpoint
      ox += midX - pmidX; oy += midY - pmidY;
      applyScale(scale * (newD / prevD), midX, midY);
    }
    lastTouches = touches;
  }, { passive: false });

  document.getElementById('cropConfirmBtn').addEventListener('click', () => {
    onConfirm(canvas.toDataURL('image/jpeg', 0.92));
  });
  document.getElementById('cropCancelBtn').addEventListener('click', onCancel);
}
