/* openSearchPanel — search the TCG API by card name and place result in a slot.
   prefillName pre-fills the input (e.g. from Claude's scan guess) and triggers an auto-search.
   Optional set filter narrows results to a specific set. */
function openSearchPanel(pageIndex, slotIndex, prefillName = ''){
  pendingPickSlotRef = { pageIndex, slotIndex };
  showOverlay(`
    <h2>🔍 Find a Card</h2>
    <input type="text" id="searchInput" placeholder="Card name, e.g. Charizard"
           value="${escapeHtml(prefillName)}" autocorrect="off">
    <input type="text" id="searchSetFilter" placeholder="Set filter (optional), e.g. Base Set"
           autocorrect="off" style="margin-top:4px;font-size:13px;color:#555;">
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="primary" id="searchGoBtn" style="flex:1;">Search</button>
      <button class="secondary" id="searchCancelBtn">← Back</button>
    </div>
    <div id="resultsGrid"></div>
  `);
  const input = document.getElementById('searchInput');
  input.focus();
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
  document.getElementById('searchSetFilter').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
  document.getElementById('searchGoBtn').addEventListener('click', doSearch);
  document.getElementById('searchCancelBtn').addEventListener('click', () => openSlotOptions(pageIndex, slotIndex));
  if (prefillName) doSearch(); // auto-search when opened from not-found panel
}

async function doSearch(){
  const q         = document.getElementById('searchInput').value.trim();
  const setFilter = (document.getElementById('searchSetFilter')?.value || '').trim();
  const resultsGrid = document.getElementById('resultsGrid');
  if (!q){ resultsGrid.innerHTML = '<div class="emptyMsg">Type a card name to search.</div>'; return; }
  resultsGrid.innerHTML = '<div class="loadingMsg">Searching…</div>';

  try{
    const headers = {};
    if (binderState.apiKey) headers['X-Api-Key'] = binderState.apiKey;
    // Use raw name in Lucene query — encodeURIComponent on the full qStr handles URL encoding.
    // Quoted phrase for multi-word names so Lucene treats them as one term, not two.
    const nameQ = q.includes(' ') ? `name:"${q}"` : `name:${q}*`;
    let qStr = nameQ;
    if (setFilter) qStr += ` ${setNameQ(setFilter)}`;
    const url = `https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(qStr)}&pageSize=30`;
    const res = await fetch(url, { headers });
    if (!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();
    const cards = data.data || [];
    if (cards.length === 0){
      resultsGrid.innerHTML = '<div class="emptyMsg">No cards found. Try a broader name or clear the set filter.</div>';
      return;
    }
    resultsGrid.innerHTML = '';
    cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'resultCard';
      el.innerHTML = `<img src="${card.images.small}" alt="${escapeHtml(card.name)}">
        <div>${escapeHtml(card.name)}</div>
        <div style="color:#999;font-size:10px;">${escapeHtml(card.set ? card.set.name : '')} #${escapeHtml(card.number||'')}</div>`;
      el.addEventListener('click', () => placeCard(card));
      resultsGrid.appendChild(el);
    });
  }catch(e){
    console.warn(e);
    resultsGrid.innerHTML = '<div class="emptyMsg">Search failed. Check your connection or API key.</div>';
  }
}

/* openNotFoundPanel — shown when Claude identified a card but the TCG API couldn't match it,
   OR when Claude couldn't read the card at all.
   Shows ALL 8 fields Claude read as editable inputs; retry uses them in up to 7 query passes. */
function openNotFoundPanel(pageIndex, slotIndex, guess){
  const g = guess || {};
  const gName      = g.name      || '';
  const gNum       = (g.number   || '').toString().split('/')[0].trim();
  const gSet       = g.set       || '';
  const gRarity    = g.rarity    || '';
  const gHp        = g.hp        || '';
  const gSupertype = g.supertype || '';
  const gSubtypes  = g.subtypes  || '';
  const gArtist    = g.artist    || '';

  const lbl = (text, note = '') =>
    `<label style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:2px;">${text}${note ? ` <span style="font-size:9px;color:#bbb;">${note}</span>` : ''}</label>`;
  const inp = (id, val, ph = '') =>
    `<input type="text" id="${id}" value="${escapeHtml(val)}" placeholder="${ph}" autocorrect="off" spellcheck="false">`;

  showOverlay(`
    <h2 style="margin-bottom:4px;">Card Not Found</h2>
    <p style="font-size:12px;color:#e83;margin:0 0 8px 0;">
      Claude read these details from your photo — correct anything that looks wrong, then retry.
      Every field is used as a search clue.
    </p>

    ${lbl('Card Name', '(full name, top of card)')}
    ${inp('nfName', gName, "e.g. Blaine's Charmander")}

    <div style="display:flex;gap:6px;margin-top:6px;">
      <div style="flex:2;display:flex;flex-direction:column;">
        ${lbl('Set Name', '(logo / text on card)')}
        ${inp('nfSet', gSet, 'e.g. Gym Challenge')}
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        ${lbl('Card #', '(bottom-right)')}
        ${inp('nfNum', gNum, 'e.g. 61')}
      </div>
    </div>

    <div style="display:flex;gap:6px;margin-top:6px;">
      <div style="flex:1;display:flex;flex-direction:column;">
        ${lbl('HP', '(Pokémon only)')}
        ${inp('nfHp', gHp, 'e.g. 70')}
      </div>
      <div style="flex:1.4;display:flex;flex-direction:column;">
        ${lbl('Type')}
        <select id="nfSupertype" style="padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
          <option value="">— unknown —</option>
          ${['Pokémon','Trainer','Energy'].map(t => `<option value="${t}"${gSupertype===t?' selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1.5;display:flex;flex-direction:column;">
        ${lbl('Subtype')}
        ${inp('nfSubtypes', gSubtypes, 'Basic, GX, V…')}
      </div>
    </div>

    <div style="display:flex;gap:6px;margin-top:6px;">
      <div style="flex:1;display:flex;flex-direction:column;">
        ${lbl('Rarity', '(bottom symbol)')}
        ${inp('nfRarity', gRarity, 'Common, Rare…')}
      </div>
      <div style="flex:2;display:flex;flex-direction:column;">
        ${lbl('Artist', '(bottom of card)')}
        ${inp('nfArtist', gArtist, 'e.g. Mitsuhiro Arita')}
      </div>
    </div>

    <button class="primary" id="nfRetryBtn" style="width:100%;margin-top:10px;margin-bottom:10px;">
      🔄 Retry Search with All Details
    </button>
    <div style="font-size:11px;color:#aaa;text-align:center;margin-bottom:8px;">— or try a different method —</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <button class="secondary" id="nfNameBtn">🔍 Search by Name</button>
      <button class="secondary" id="nfSetNumBtn">🔢 Exact Set + #</button>
      <button class="secondary" id="nfBrowseBtn">📦 Browse a Set</button>
      <button class="secondary" id="nfCustomBtn">✏️ Add as Custom</button>
    </div>
    <div class="closeRow">
      <button class="secondary" id="nfBackBtn">← Back to Options</button>
    </div>
  `);

  document.getElementById('nfRetryBtn').addEventListener('click', async () => {
    const name      = document.getElementById('nfName').value.trim();
    const set       = document.getElementById('nfSet').value.trim();
    const num       = document.getElementById('nfNum').value.trim().split('/')[0].trim();
    const hp        = document.getElementById('nfHp').value.trim();
    const supertype = document.getElementById('nfSupertype').value;
    const subtypes  = document.getElementById('nfSubtypes').value.trim();
    const rarity    = document.getElementById('nfRarity').value.trim();
    const artist    = document.getElementById('nfArtist').value.trim();

    if (!name && !artist){ toast('Fill in at least the card name or artist.'); return; }
    showLoading('Searching with all details…');

    const headers = {};
    if (binderState.apiKey) headers['X-Api-Key'] = binderState.apiKey;
    const tryQ = async (q) => {
      try{
        const r = await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=6`, { headers });
        const d = await r.json(); return d.data?.[0] || null;
      }catch{ return null; }
    };

    let card = null;

    // Most specific → least specific. Each pass uses a different combination of clues.
    if (name && num && set)     card = await tryQ(`name:"${name}" number:${num} ${setNameQ(set)}`);
    if (!card && name && num)   card = await tryQ(`name:"${name}" number:${num}`);
    if (!card && artist && num) card = await tryQ(`artist:"${artist}" number:${num}`);
    if (!card && name && set && hp)    card = await tryQ(`name:"${name}" ${setNameQ(set)} hp:${hp}`);
    if (!card && name && hp && rarity) card = await tryQ(`name:"${name}"* hp:${hp} rarity:"${rarity}"`);
    if (!card && artist && set) card = await tryQ(`artist:"${artist}" ${setNameQ(set)}`);
    if (!card && name && subtypes && set) card = await tryQ(`name:"${name}"* subtypes:"${subtypes}" ${setNameQ(set)}`);
    // Last resort: just the name through the standard 7-pass search
    if (!card && name) card = await searchTCGForCard(name, set, num, { artist, hp });

    hideLoading();
    if (!card){ toast('Still no match — try correcting a field or use another method below.'); return; }
    placeFoundCard(card, pageIndex, slotIndex);
  });

  document.getElementById('nfNameBtn').addEventListener('click', () => {
    openSearchPanel(pageIndex, slotIndex, document.getElementById('nfName').value.trim());
  });
  document.getElementById('nfSetNumBtn').addEventListener('click', () => {
    openSetNumberSearch(pageIndex, slotIndex,
      document.getElementById('nfSet').value.trim(),
      document.getElementById('nfNum').value.trim());
  });
  document.getElementById('nfBrowseBtn').addEventListener('click', () => {
    openBrowseSetPanel(pageIndex, slotIndex, document.getElementById('nfSet').value.trim());
  });
  document.getElementById('nfCustomBtn').addEventListener('click', () => {
    openCustomCardPanel(pageIndex, slotIndex, {
      name: document.getElementById('nfName').value.trim(),
      set:  document.getElementById('nfSet').value.trim()
    });
  });
  document.getElementById('nfBackBtn').addEventListener('click', () => openSlotOptions(pageIndex, slotIndex));
}

/* placeFoundCard — write a confirmed API card directly into a slot.
   If slotIndex is -1 (page-level scan), shows the slot picker instead. */
function placeFoundCard(card, pageIndex, slotIndex){
  if (slotIndex >= 0){
    binderState.pages[pageIndex][slotIndex] = {
      cardId: card.id,
      name:   card.name,
      image:  card.images.large || card.images.small,
      set:    card.set?.name || '',
      owned: true, quantity: 1, condition: 'Near Mint', notes: '',
      price:        getMarketPrice(card.tcgplayer),
      priceDetails: card.tcgplayer?.prices || null
    };
    persist();
    renderPage(currentSpread, null);
    updateSummary();
    hideOverlay();
    toast(`${card.name} added to slot ${slotIndex + 1}.`);
  } else {
    openSlotPicker(pageIndex, card);
  }
}

/* openSetNumberSearch — precision lookup by set name + card number.
   The number alone uniquely identifies a card within its set; combining both
   fields makes this the most reliable search when the card name is unclear. */
function openSetNumberSearch(pageIndex, slotIndex, prefillSet = '', prefillNumber = ''){
  pendingPickSlotRef = { pageIndex, slotIndex };
  const pNum = prefillNumber.toString().split('/')[0].trim();

  showOverlay(`
    <h2 style="margin-bottom:6px;">🔢 Search by Set + Number</h2>
    <p style="font-size:12px;color:#888;margin:0 0 10px 0;">
      Enter the <strong>set name</strong> and the <strong>number</strong> printed at the
      bottom-right of the card (e.g. <em>61</em> from 61/132).
    </p>
    <label style="font-size:12px;color:#555;">Set Name</label>
    <input type="text" id="snsSet" value="${escapeHtml(prefillSet)}"
           placeholder="e.g. Gym Challenge, Base Set" autocorrect="off" style="margin-bottom:6px;">
    <label style="font-size:12px;color:#555;">Card Number</label>
    <input type="text" id="snsNum" value="${escapeHtml(pNum)}"
           placeholder="e.g. 61" autocorrect="off" style="margin-bottom:8px;">
    <div style="display:flex;gap:8px;margin-bottom:4px;">
      <button class="primary" id="snsGoBtn" style="flex:1;">Find Card</button>
      <button class="secondary" id="snsCancelBtn">← Back</button>
    </div>
    <div id="snsResults" style="margin-top:8px;"></div>
  `);

  const doSNSearch = async () => {
    const setVal = document.getElementById('snsSet').value.trim();
    const numVal = document.getElementById('snsNum').value.trim().split('/')[0].trim();
    const el = document.getElementById('snsResults');
    if (!setVal && !numVal){ toast('Enter a set name or card number.'); return; }
    el.innerHTML = '<div class="loadingMsg">Searching…</div>';
    try{
      const headers = {};
      if (binderState.apiKey) headers['X-Api-Key'] = binderState.apiKey;
      let q = '';
      if (setVal && numVal)  q = `${setNameQ(setVal)} number:${numVal}`;
      else if (numVal)       q = `number:${numVal}`;
      else                   q = setNameQ(setVal);
      const res  = await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=30`, { headers });
      const data = await res.json();
      const cards = data.data || [];
      if (!cards.length){
        el.innerHTML = '<div class="emptyMsg">No match. Try checking the set name spelling.</div>';
        return;
      }
      el.innerHTML = '';
      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'resultCard';
        div.innerHTML = `<img src="${card.images.small}" alt="${escapeHtml(card.name)}">
          <div>${escapeHtml(card.name)}</div>
          <div style="color:#999;font-size:10px;">${escapeHtml(card.set?.name||'')} #${escapeHtml(card.number||'')}</div>`;
        div.addEventListener('click', () => placeCard(card));
        el.appendChild(div);
      });
    }catch(e){
      el.innerHTML = '<div class="emptyMsg">Search failed. Check your connection.</div>';
    }
  };

  document.getElementById('snsGoBtn').addEventListener('click', doSNSearch);
  document.getElementById('snsSet').addEventListener('keydown', (e) => { if(e.key==='Enter') doSNSearch(); });
  document.getElementById('snsNum').addEventListener('keydown', (e) => { if(e.key==='Enter') doSNSearch(); });
  document.getElementById('snsCancelBtn').addEventListener('click', () => openSlotOptions(pageIndex, slotIndex));

  if (prefillSet && pNum) doSNSearch(); // auto-search if both fields came pre-filled
}

/* openBrowseSetPanel — two-step set browser: search for a set by name → see all its cards.
   Useful when you know the set but can't read the card name from the photo. */
function openBrowseSetPanel(pageIndex, slotIndex, prefillSetName = ''){
  pendingPickSlotRef = { pageIndex, slotIndex };

  showOverlay(`
    <h2 style="margin-bottom:6px;">📦 Browse a Set</h2>
    <p style="font-size:12px;color:#888;margin:0 0 8px 0;">
      Search for a set, then tap it to browse all its cards.
    </p>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" id="setSearchInput" value="${escapeHtml(prefillSetName)}"
             placeholder="e.g. Base Set, Gym Challenge" autocorrect="off" style="flex:1;">
      <button class="primary" id="setSearchGoBtn">Find Sets</button>
    </div>
    <button class="secondary" id="setSearchCancelBtn" style="width:100%;margin-bottom:8px;">← Back</button>
    <div id="setResultsList"></div>
  `);

  const doSetSearch = async () => {
    const q  = document.getElementById('setSearchInput').value.trim();
    const el = document.getElementById('setResultsList');
    if (!q){ toast('Enter a set name to search.'); return; }
    el.innerHTML = '<div class="loadingMsg">Searching sets…</div>';
    try{
      const headers = {};
      if (binderState.apiKey) headers['X-Api-Key'] = binderState.apiKey;
      // Strip apostrophes from set-name searches — "McDonald's" → "McDonald" so the
      // wildcard query name:McDonald* finds "McDonald's Collection YYYY" correctly.
      const fetchSets = async (luceneQ) => {
        const r = await fetch(`https://api.pokemontcg.io/v2/sets?q=${encodeURIComponent(luceneQ)}&pageSize=20`, { headers });
        const d = await r.json(); return d.data || [];
      };
      const seen = new Set(); let sets = [];
      const merge = arr => arr.forEach(s => { if (!seen.has(s.id)){ seen.add(s.id); sets.push(s); } });

      if (/mcdonald/i.test(q)){
        merge(await fetchSets('name:McDonald*'));
      } else {
        // Short alphanumeric = likely a set code (SSP, PAF, OBF, etc.)
        if (q.length <= 5 && /^[A-Za-z0-9]+$/.test(q)){
          merge(await fetchSets(`ptcgoCode:${q.toUpperCase()}`));
        }
        if (!sets.length){
          // Quoted phrase for multi-word names; wildcard prefix for single word
          const nameQ = q.includes(' ') ? `name:"${q}"` : `name:${q}*`;
          merge(await fetchSets(nameQ));
        }
        // Fallback: first-word wildcard (catches partial / abbreviated multi-word names)
        if (!sets.length){
          merge(await fetchSets(`name:${q.split(' ')[0]}*`));
        }
      }
      sets.sort((a,b) => (b.releaseDate||'').localeCompare(a.releaseDate||''));
      if (!sets.length){
        el.innerHTML = '<div class="emptyMsg">No sets found. Try the full name, first word, or set code (e.g. SSP for Surging Sparks).</div>';
        return;
      }
      el.innerHTML = '';
      sets.forEach(set => {
        const div = document.createElement('div');
        div.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;cursor:pointer;';
        div.innerHTML = `
          ${set.images?.symbol ? `<img src="${set.images.symbol}" alt="" style="width:28px;height:28px;object-fit:contain;flex-shrink:0;">` : '<div style="width:28px;flex-shrink:0;"></div>'}
          <div style="overflow:hidden;">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(set.name)}</div>
            <div style="font-size:11px;color:#888;">${escapeHtml(set.series||'')} · ${set.total||'?'} cards${set.releaseDate ? ' · ' + escapeHtml(set.releaseDate) : ''}</div>
          </div>`;
        div.addEventListener('click', () => browseSetCards(set, pageIndex, slotIndex));
        el.appendChild(div);
      });
    }catch(e){
      el.innerHTML = '<div class="emptyMsg">Search failed. Check your connection.</div>';
    }
  };

}

/* browseSetCards — loads and displays all cards in a set as a tappable image grid. */
async function browseSetCards(set, pageIndex, slotIndex){
  pendingPickSlotRef = { pageIndex, slotIndex };

  showOverlay(`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
      ${set.images?.symbol ? `<img src="${set.images.symbol}" alt="" style="width:22px;height:22px;object-fit:contain;flex-shrink:0;">` : ''}
      <h2 style="margin:0;font-size:16px;">${escapeHtml(set.name)}</h2>
    </div>
    <p style="font-size:12px;color:#888;margin:0 0 8px 0;">${set.total||'?'} cards — tap one to add it to the slot.</p>
    <button class="secondary" id="browseBackBtn" style="width:100%;margin-bottom:8px;">← Back to Sets</button>
    <div id="browseGrid" class="resultsGrid" style="margin-top:0;"></div>
  `);

  document.getElementById('browseBackBtn').addEventListener('click', () => openBrowseSetPanel(pageIndex, slotIndex, set.name));

  const el = document.getElementById('browseGrid');
  el.innerHTML = '<div class="loadingMsg">Loading cards…</div>';

  try{
    const headers = {};
    if (binderState.apiKey) headers['X-Api-Key'] = binderState.apiKey;
    const res  = await fetch(
      `https://api.pokemontcg.io/v2/cards?q=set.id:${encodeURIComponent(set.id)}&pageSize=250&orderBy=number`,
      { headers }
    );
    const data = await res.json();
    const cards = data.data || [];
    if (!cards.length){ el.innerHTML = '<div class="emptyMsg">No cards found in this set.</div>'; return; }
    el.innerHTML = '';
    cards.forEach(card => {
      const div = document.createElement('div');
      div.className = 'resultCard';
      div.innerHTML = `<img src="${card.images.small}" alt="${escapeHtml(card.name)}">
        <div>${escapeHtml(card.name)}</div>
        <div style="color:#999;font-size:10px;">#${escapeHtml(card.number||'')}</div>`;
      div.addEventListener('click', () => placeCard(card));
      el.appendChild(div);
    });
  }catch(e){
    el.innerHTML = '<div class="emptyMsg">Failed to load cards. Check your connection.</div>';
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Build the correct set.name clause for TCG API queries.
// McDonald's set names contain an apostrophe ("McDonald's Collection 2021") which breaks
// Lucene quoted-string queries. Using the prefix wildcard set.name:McDonald* avoids the
// apostrophe entirely and still matches every year of the collection.
function setNameQ(setName){
  if (!setName) return '';
  return /mcdonald/i.test(setName)
    ? 'set.name:McDonald*'
    : `set.name:"${setName}"`;
}

function placeCard(card){
  if (!pendingPickSlotRef) return;

  // scan-fix mode: update review data instead of writing to binder directly
  if (pendingPickSlotRef.isScanFix){
    const { scanSlotIndex } = pendingPickSlotRef;
    const hash = scanReviewData[scanSlotIndex]?.hash;
    const cellDataUrl = scanReviewData[scanSlotIndex]?.cellDataUrl;
    scanReviewData[scanSlotIndex] = {
      cardId: card.id,
      name: card.name,
      image: card.images.large || card.images.small,
      set: card.set?.name || '',
      confidence: 'fixed',
      hash,
      cellDataUrl
    };
    if (hash) saveCorrection(hash, {
      cardId: card.id, name: card.name,
      image: card.images.large || card.images.small,
      set: card.set?.name || ''
    });
    pendingPickSlotRef = null;
    openScanReviewPanel(scanPageIndex, scanReviewData);
    toast(`Slot ${scanSlotIndex + 1} → ${card.name}`);
    return;
  }

  const { pageIndex, slotIndex } = pendingPickSlotRef;
  // slotIndex = -1 means page-level scan — show picker instead of direct placement
  if (slotIndex < 0){ pendingPickSlotRef = null; openSlotPicker(pageIndex, card); return; }
  binderState.pages[pageIndex][slotIndex] = {
    cardId: card.id,
    name: card.name,
    image: card.images.large || card.images.small,
    set: card.set ? card.set.name : '',
    owned: true,
    quantity: 1,
    condition: 'Near Mint',
    notes: '',
    price: getMarketPrice(card.tcgplayer),
    priceDetails: card.tcgplayer?.prices ? card.tcgplayer.prices : null
  };
  persist();
  hideOverlay();
  renderPage(currentSpread, null);
  updateSummary();
  toast(`Added ${card.name} to the binder.`);
}

/* buildPriceSectionHTML — generates the price block shown inside the card
   detail panel. Displays the top-level market price plus a per-variant
   breakdown (Holofoil, Reverse Holo, Normal, etc.) and a Refresh button.
   Returns an HTML string; injected via showOverlay so it renders as part
   of the overlay rather than being appended separately. */
function buildPriceSectionHTML(slot){
  // Human-readable labels for the API's camelCase variant keys
  const VARIANT_LABELS = {
    normal: 'Normal', holofoil: 'Holofoil',
    reverseHolofoil: 'Reverse Holo', '1stEditionHolofoil': '1st Ed Holo',
    unlimitedHolofoil: 'Unlimited Holo'
  };

  // Build one row per variant that has a market price
  let rows = '';
  if (slot.priceDetails){
    for (const [key, p] of Object.entries(slot.priceDetails)){
      if (!p || p.market == null) continue; // skip variants with no market data
      const label = VARIANT_LABELS[key] || key; // fall back to raw key if unknown variant
      rows += `<div class="priceBreakdown"><span>${escapeHtml(label)}</span><span>$${p.market.toFixed(2)}</span></div>`;
    }
  }

  // Show dash if price hasn't been fetched yet
  const mainPrice = slot.price != null ? `$${Number(slot.price).toFixed(2)}` : '—';

  // Wrapper id="priceSectionWrapper" lets the Refresh button replace this
  // block in-place after re-fetching, without re-rendering the whole panel
  return `<div id="priceSectionWrapper" class="priceSection">
    <div class="priceMain">TCGPlayer Market: <strong>${mainPrice}</strong></div>
    ${rows}
    <button id="refreshPriceBtn" class="secondary" style="margin-top:6px;font-size:12px;">&#8635; Refresh Price</button>
  </div>`;
}

/* ---------------------------------------------------------------------
   MOVE / SWAP — lets the user relocate a card to any slot on any page.
   Shows a visual 3×3 grid of the target page.
   - Tapping an EMPTY slot moves the card there (origin becomes empty).
   - Tapping a FILLED slot swaps the two cards.
   Prev/Next buttons navigate across pages without closing the panel.
--------------------------------------------------------------------- */
function openMovePanel(fromPage, fromSlot, viewPage){
  // viewPage: which page's grid is currently displayed (defaults to fromPage)
  if (viewPage === undefined) viewPage = fromPage;
  const card = binderState.pages[fromPage][fromSlot];
  if (!card) return;
  const page = binderState.pages[viewPage];
  const totalPages = binderState.pages.length;

  // Build the 3×3 grid cells for the viewed page
  let cellsHtml = '';
  for (let i = 0; i < 9; i++){
    const existing = page[i];
    const isSelf = (viewPage === fromPage && i === fromSlot); // this is the card being moved
    const label = i + 1;
    if (isSelf){
      // Highlight the card's current position
      cellsHtml += `
        <div class="slotPickerCell" style="border-color:#f90;background:#fff8e0;cursor:default;" title="Current position">
          <span class="slotPickerNum">${label}</span>
          ${card.image ? `<img src="${card.image}" alt="${escapeHtml(card.name)}" style="opacity:.5;">` : ''}
          <span style="font-size:9px;color:#f90;margin-top:2px;">here</span>
        </div>`;
    } else if (existing){
      // Filled slot — tapping swaps the two cards
      cellsHtml += `
        <div class="slotPickerCell filled" data-action="swap" data-topage="${viewPage}" data-toslot="${i}"
             style="cursor:pointer;opacity:1;border-color:#8ab4f8;"
             title="Swap with: ${escapeHtml(existing.name)}">
          <span class="slotPickerNum">${label}</span>
          ${existing.image ? `<img src="${existing.image}" alt="${escapeHtml(existing.name)}">` : ''}
          <span style="position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;color:#fff;background:rgba(0,0,0,.45);padding:1px 0;">swap</span>
        </div>`;
    } else {
      // Empty slot — tapping moves the card here
      cellsHtml += `
        <div class="slotPickerCell empty" data-action="move" data-topage="${viewPage}" data-toslot="${i}"
             title="Move to slot ${label}">
          <span class="slotPickerNum">${label}</span>
          <span style="font-size:18px;margin-top:4px;">+</span>
          <span style="font-size:10px;margin-top:2px;">move here</span>
        </div>`;
    }
  }

  showOverlay(`
    <h2 style="margin-bottom:4px;">↕ Move / Swap</h2>
    <div class="slotPickerCard" style="margin-bottom:10px;">
      ${card.image ? `<img src="${card.image}" alt="${escapeHtml(card.name)}">` : ''}
      <div>
        <strong>${escapeHtml(card.name)}</strong>
        <div style="font-size:12px;color:#888;">${escapeHtml(card.set||'')}</div>
        <div style="font-size:11px;color:#aaa;margin-top:4px;">From page ${fromPage+1}, slot ${fromSlot+1}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <button class="secondary" id="movePrevPage" ${viewPage===0?'disabled':''} style="padding:4px 10px;">◀</button>
      <span style="font-size:13px;font-weight:600;">Page ${viewPage+1} of ${totalPages}</span>
      <button class="secondary" id="moveNextPage" ${viewPage===totalPages-1?'disabled':''} style="padding:4px 10px;">▶</button>
    </div>
    <div class="slotPickerGrid">${cellsHtml}</div>
    <p style="font-size:11px;color:#aaa;text-align:center;margin:6px 0 0;">
      Tap <strong style="color:#4a8;">+</strong> to move · Tap a card to swap
    </p>
    <div class="closeRow" style="margin-top:10px;">
      <button class="secondary" id="moveCancelBtn">Cancel</button>
    </div>
  `);

  document.getElementById('moveCancelBtn').addEventListener('click', hideOverlay);

  // Page navigation — re-render the panel showing a different page's grid
  document.getElementById('movePrevPage').addEventListener('click', () => openMovePanel(fromPage, fromSlot, viewPage - 1));
  document.getElementById('moveNextPage').addEventListener('click', () => openMovePanel(fromPage, fromSlot, viewPage + 1));

  // Wire move and swap clicks
  document.querySelectorAll('[data-action]').forEach(cell => {
    cell.addEventListener('click', () => {
      const toPage = parseInt(cell.dataset.topage);
      const toSlot = parseInt(cell.dataset.toslot);
      const action = cell.dataset.action;

      if (action === 'move'){
        // Move: place card in empty slot, clear origin
        binderState.pages[toPage][toSlot] = binderState.pages[fromPage][fromSlot];
        binderState.pages[fromPage][fromSlot] = null;
        persist();
        renderPage(currentSpread, null);
        updateSummary();
        hideOverlay();
        toast(`${card.name} moved to page ${toPage+1}, slot ${toSlot+1}.`);
      } else {
        // Swap: exchange the two cards
        const temp = binderState.pages[toPage][toSlot];
        binderState.pages[toPage][toSlot] = binderState.pages[fromPage][fromSlot];
        binderState.pages[fromPage][fromSlot] = temp;
        persist();
        renderPage(currentSpread, null);
        updateSummary();
        hideOverlay();
        toast(`Swapped ${card.name} ↔ ${temp.name}.`);
      }
    });
  });
}

/* ---------------------------------------------------------------------
   PAGE MANAGEMENT — add, remove, reorder
--------------------------------------------------------------------- */
const MAX_PAGES = 12;

function addPage(){
  if (binderState.pages.length >= MAX_PAGES){
    toast(`Max ${MAX_PAGES} pages reached.`);
    return;
  }
  const newPage = new Array(SLOTS_PER_PAGE).fill(null);
  binderState.pages.splice(currentSpread + 1, 0, newPage);
  currentSpread++;
  persist();
  renderPage(currentSpread, 'next');
  updateCounter();
  updateSummary();
  toast(`Page ${currentSpread + 1} added.`);
}

function removePage(){
  const total = binderState.pages.length;
  if (total <= 1){ toast("Can't remove the last page."); return; }
  const page = binderState.pages[currentSpread];
  const hasCards = page.some(s => s !== null);
  if (hasCards){
    showOverlay(`
      <h2>Remove page ${currentSpread + 1}?</h2>
      <p style="font-size:14px;color:#555;margin:0 0 16px;">
        This page has cards in it. Removing it will delete all ${page.filter(Boolean).length} card(s) from this page permanently.
      </p>
      <button class="primary" id="confirmRemoveBtn" style="background:#c0392b;">Yes, remove</button>
      <button class="secondary" id="cancelRemoveBtn" style="margin-left:8px;">Cancel</button>
    `);
    document.getElementById('confirmRemoveBtn').addEventListener('click', () => {
      doRemovePage();
      hideOverlay();
    });
    document.getElementById('cancelRemoveBtn').addEventListener('click', hideOverlay);
  } else {
    doRemovePage();
  }
}

function doRemovePage(){
  binderState.pages.splice(currentSpread, 1);
  if (currentSpread >= binderState.pages.length) currentSpread = binderState.pages.length - 1;
  persist();
  renderPage(currentSpread, null);
  updateCounter();
  updateSummary();
  toast(`Page removed.`);
}

function movePage(direction){
  const from = currentSpread;
  const to = direction === 'left' ? from - 1 : from + 1;
  if (to < 0 || to >= binderState.pages.length) return;
  const tmp = binderState.pages[from];
  binderState.pages[from] = binderState.pages[to];
  binderState.pages[to] = tmp;
  currentSpread = to;
  persist();
  renderPage(currentSpread, direction === 'left' ? 'prev' : 'next');
  updateCounter();
  toast(`Page moved ${direction === 'left' ? 'back' : 'forward'}.`);
}

let scanReviewData = [];
let scanPageIndex = -1;
let correctionsCache = {};

// ---- image helpers ----
function fileToDataUrl(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function resizeImage(dataUrl, maxSide){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', 0.88));
    };
    img.src = dataUrl;
  });
}

function cropGrid(dataUrl){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const cw = Math.floor(img.width / 3);
      const ch = Math.floor(img.height / 3);
      const cells = [];
      for (let row = 0; row < 3; row++){
        for (let col = 0; col < 3; col++){
          const c = document.createElement('canvas');
          c.width = cw; c.height = ch;
          c.getContext('2d').drawImage(img, col*cw, row*ch, cw, ch, 0, 0, cw, ch);
          cells.push(c.toDataURL('image/jpeg', 0.82));
        }
      }
      res(cells);
    };
    img.src = dataUrl;
  });
}

// ---- perceptual hash (dHash 8x8 = 64 bits) ----
function computeDHash(dataUrl){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = 9; c.height = 8;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 9, 8);
      const d = ctx.getImageData(0, 0, 9, 8).data;
      let hash = '';
      for (let y = 0; y < 8; y++){
        for (let x = 0; x < 8; x++){
          const i = (y * 9 + x) * 4;
          const j = (y * 9 + x + 1) * 4;
          const gL = 0.299*d[i]   + 0.587*d[i+1] + 0.114*d[i+2];
          const gR = 0.299*d[j]   + 0.587*d[j+1] + 0.114*d[j+2];
          hash += gL > gR ? '1' : '0';
        }
      }
      res(hash);
    };
    img.src = dataUrl;
  });
}

function hashDistance(h1, h2){
  let d = 0;
  for (let i = 0; i < h1.length; i++) if (h1[i] !== h2[i]) d++;
  return d;
}

// ---- correction cache (Firestore or localStorage) ----
async function loadCorrections(){
  if (firebaseReady){
    try{
      const snap = await db.collection('corrections').get();
      snap.forEach(doc => { correctionsCache[doc.id] = doc.data(); });
    }catch(e){ /* corrections are optional */ }
  } else {
    try{
      const raw = localStorage.getItem('louis_binder_corrections');
      if (raw) correctionsCache = JSON.parse(raw);
    }catch(e){}
  }
}

async function saveCorrection(hash, cardData){
  correctionsCache[hash] = cardData;
  if (firebaseReady){
    try{ await db.collection('corrections').doc(hash).set(cardData); }catch(e){}
  } else {
    try{ localStorage.setItem('louis_binder_corrections', JSON.stringify(correctionsCache)); }catch(e){}
  }
}

function lookupCorrection(hash){
  if (correctionsCache[hash]) return { ...correctionsCache[hash], fromCache: true };
  for (const [h, data] of Object.entries(correctionsCache)){
    if (hashDistance(hash, h) <= 8) return { ...data, fromCache: true };
  }
  return null;
}

// ---- Claude vision API call ----
async function identifyWithClaude(imageDataUrl, apiKey){
  const base64 = imageDataUrl.split(',')[1];
  const mediaType = imageDataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: 1024,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: `This is a photo of a Pokémon card binder page with a 3×3 grid of 9 card slots. Identify each card left to right, top to bottom (slot 1 = top-left, slot 9 = bottom-right).

For each slot provide the Pokémon card name, set name, and card number if visible. If a slot is empty or unreadable, use name "unknown".

Respond ONLY with a valid JSON array of exactly 9 objects, no other text:
[{"slot":1,"name":"Charizard","set":"Base Set","number":"4/102","confidence":"high"},...]

Use confidence "high", "medium", or "low" based on how clearly you can read the card.` }
        ]
      }]
    })
  });

  if (!res.ok){
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `Claude API error ${res.status}`);
  }

  const data = await res.json();
  const text = data.content?.[0]?.text || '[]';
  const match = text.match(/\[[\s\S]*\]/);
  if (!match) throw new Error("Could not parse Claude response as JSON");
  const parsed = JSON.parse(match[0]);

  const result = new Array(9).fill(null).map(() => ({ name: 'unknown', set: '', number: '', confidence: 'low' }));
  parsed.forEach(item => {
    const idx = (item.slot || 1) - 1;
    if (idx >= 0 && idx < 9) result[idx] = { name: item.name || 'unknown', set: item.set || '', number: item.number || '', confidence: item.confidence || 'low' };
  });
  return result;
}

// ---- single-card Claude vision call ----
// Reads 8 fields from the card photo — all are used in the not-found panel and extended search.
async function identifySingleCard(imageDataUrl, apiKey){
  const base64 = imageDataUrl.split(',')[1];
  const mediaType = imageDataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: 320,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: `You are reading a Pokémon TCG card photo. Extract every visible detail:

1. NAME — full card name including any trainer prefix (e.g. "Blaine's Charmander", "Team Rocket's Mewtwo")
2. NUMBER — exactly as printed bottom-right (e.g. "61/132", "SWSH001", "TG01/TG30")
3. SET — set name from the logo/symbol/text (e.g. "Gym Challenge", "Base Set", "Scarlet & Violet"). If the card shows a golden arches / McDonald's M symbol, set SET to "McDonald's Collection" followed by the year if visible (e.g. "McDonald's Collection 2021")
4. RARITY — bottom symbol: circle=Common, diamond=Uncommon, star=Rare, star+sparkle=Holo Rare, 2stars=Ultra Rare
5. HP — HP number if Pokémon (e.g. "70"), empty string if Trainer or Energy
6. SUPERTYPE — exactly one of: "Pokémon", "Trainer", "Energy"
7. SUBTYPES — stage or variant printed on card (e.g. "Basic", "Stage 1", "GX", "V", "VMAX", "VSTAR", "ex", "EX", "Item", "Supporter", "Stadium")
8. ARTIST — illustrator credit at card bottom (e.g. "Mitsuhiro Arita"), empty string if unreadable

Respond ONLY with valid JSON, no markdown, no explanation:
{"name":"Blaine's Charmander","number":"61/132","set":"Gym Challenge","rarity":"Common","hp":"70","supertype":"Pokémon","subtypes":"Basic","artist":"Mitsuhiro Arita","confidence":"high"}

If card is unreadable: {"name":"unknown","number":"","set":"","rarity":"","hp":"","supertype":"","subtypes":"","artist":"","confidence":"low"}` }
        ]
      }]
    })
  });
  if (!res.ok){
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `Claude API error ${res.status}`);
  }
  const data = await res.json();
  const text = data.content?.[0]?.text || '';
  const match = text.match(/\{[\s\S]*?\}/);
  if (!match) return { name: 'unknown', set: '', number: '', confidence: 'low' };
  try { return JSON.parse(match[0]); } catch { return { name: 'unknown', set: '', number: '', confidence: 'low' }; }
}

// ---- TCG API lookup for a guessed name + number ----
// 7-pass search: starts with the most precise identifiers and broadens if nothing is found.
// meta = { artist, hp } from Claude's reading — used in passes 6 & 7.
// returnAll:true collects up to `limit` unique candidates across all passes (for the picker panel).
// Default mode (returnAll:false) returns the first match and exits early, as before.
async function searchTCGForCard(name, set, number, meta = {}, { returnAll = false, limit = 6 } = {}){
  try{
    const headers = {};
    if (binderState.apiKey) headers['X-Api-Key'] = binderState.apiKey;

    const numOnly  = number ? number.toString().split('/')[0].trim() : '';
    const setShort = set ? set.toLowerCase().split(' ').slice(0, 3).join(' ') : '';
    const tf = async (q, n) => {
      const r = await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=${n}`, { headers });
      const d = await r.json(); return d.data || [];
    };

    const candidates = []; const seenIds = new Set();
    const add = (arr) => arr.forEach(c => {
      if (!seenIds.has(c.id) && candidates.length < limit){ seenIds.add(c.id); candidates.push(c); }
    });
    const done = () => returnAll ? candidates.length >= limit : false;

    // Raw name helpers — do NOT pre-encode; tf() encodes the full query string.
    // Multi-word: use quoted phrase (no trailing wildcard). Single-word: trailing wildcard.
    const nameExact = `name:"${name}"`;
    const nameWild  = name.includes(' ') ? `name:"${name}"` : `name:${name}*`;
    const lastName  = name.split(' ').pop();
    const lastWild  = `name:${lastName}*`;

    // --- McDonald's early pass ---
    if (set && /mcdonald/i.test(set)){
      if (numOnly){
        const d = await tf(`${nameExact} number:${numOnly} set.name:McDonald*`, 6);
        if (!returnAll && d.length) return d[0];
        add(d);
      }
      if (!done()){
        const d2 = await tf(`${nameWild} set.name:McDonald*`, 10);
        if (!returnAll && d2.length) return d2[0];
        add(d2);
      }
      if (returnAll) return candidates;
    }

    // --- Pass 1: name + number + set ---
    if (!done() && numOnly && set){
      const d = await tf(`${nameExact} number:${numOnly} ${setNameQ(set)}`, 4);
      if (!returnAll && d.length) return d[0];
      add(d);
    }

    // --- Pass 2: name + number ---
    if (!done() && numOnly){
      const d = await tf(`${nameExact} number:${numOnly}`, 4);
      if (!returnAll && d.length) return d[0];
      add(d);
    }

    // --- Pass 3: last word of name + number ---
    if (!done() && numOnly){
      const d = await tf(`${lastWild} number:${numOnly}`, 8);
      if (!returnAll && d.length){
        return d.find(c => c.name.toLowerCase() === name.toLowerCase()) || d[0];
      }
      add(d);
    }

    // --- Pass 4: name + set ---
    if (!done() && set){
      const d = await tf(`${nameWild} ${setNameQ(set)}`, 6);
      if (!returnAll && d.length) return d[0];
      add(d);
    }

    // --- Pass 5: name only ---
    if (!done()){
      const d = await tf(`${nameWild}`, 16);
      if (!returnAll && d.length){
        if (setShort){
          const hit = d.find(c => c.set?.name?.toLowerCase().includes(setShort));
          if (hit) return hit;
        }
        if (!meta.artist && !meta.hp) return d[0];
      }
      add(d);
    }

    // --- Pass 6: artist + number ---
    if (!done() && numOnly && meta.artist){
      const d = await tf(`artist:"${meta.artist}" number:${numOnly}`, 4);
      if (!returnAll && d.length) return d[0];
      add(d);
    }

    // --- Pass 7: name + HP + set ---
    if (!done() && set && meta.hp){
      const d = await tf(`${nameWild} hp:${meta.hp} ${setNameQ(set)}`, 6);
      if (!returnAll && d.length) return d[0];
      add(d);
    }

    if (returnAll) return candidates;

    // Fall through from pass 5 if it had results but no set match
    {
      const d = await tf(`${nameWild}`, 4);
      if (d.length) return d[0];
    }

    return null;
  }catch(e){ return returnAll ? [] : null; }
}

// ---- main scan processor ----
async function processScanFile(file, pageIndex){
  showLoading('Reading image…');
  try{
    const dataUrl = await fileToDataUrl(file);
    const resized  = await resizeImage(dataUrl, 1200);

    showLoading('Cropping card slots…');
    const cellDataUrls = await cropGrid(resized);
    const cellHashes   = await Promise.all(cellDataUrls.map(computeDHash));
    const cached       = cellHashes.map(lookupCorrection);

    // Only call Claude for slots not in cache
    const needAI = cached.map((c, i) => c === null ? i : -1).filter(i => i >= 0);
    let claudeGuesses = new Array(9).fill(null).map(() => ({ name: 'unknown', set: '', confidence: 'low' }));

    if (needAI.length > 0){
      showLoading(`Identifying ${needAI.length} card${needAI.length > 1 ? 's' : ''} with Claude…`);
      claudeGuesses = await identifyWithClaude(resized, binderState.anthropicKey);
    }

    // Merge cache + Claude results
    showLoading('Matching official card data…');
    const resolved = await Promise.all(cellHashes.map(async (hash, i) => {
      const base = { hash, cellDataUrl: cellDataUrls[i], slotIndex: i };

      if (cached[i]){
        return { ...base, ...cached[i], confidence: 'cached', fromCache: true };
      }

      const guess = claudeGuesses[i];
      if (!guess || guess.name === 'unknown'){
        return { ...base, name: null, image: null, set: '', confidence: 'unknown' };
      }

      const card = await searchTCGForCard(guess.name, guess.set, guess.number);
      return {
        ...base,
        cardId: card?.id || null,
        name: card?.name || guess.name,
        image: card?.images?.large || card?.images?.small || null,
        set: card?.set?.name || guess.set || '',
        confidence: guess.confidence
      };
    }));

    hideLoading();
    openScanReviewPanel(pageIndex, resolved);

  }catch(err){
    hideLoading();
    console.error(err);
    toast('Scan failed: ' + (err.message || 'unknown error'));
  }
}

/* ---------------------------------------------------------------------
   SHARE FEATURE — compresses binder state into a URL fragment and opens
   a read-only viewer page (binder-share.html) that anyone can access.
   No login or Firebase required on the recipient's side.
--------------------------------------------------------------------- */

/* compressAndEncode — serialises an object to JSON, gzip-compresses it
   using the Web Streams CompressionStream API, then base64-encodes the
   result so it can be embedded in a URL hash fragment. */
async function compressAndEncode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const stream = new CompressionStream('gzip');
  const writer = stream.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const buf    = await new Response(stream.readable).arrayBuffer();
  const arr    = new Uint8Array(buf);
  let binary   = '';
  arr.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

/* buildSharePayload — strips private data (API keys, verbose priceDetails)
   from binderState and returns a clean object safe to embed in a public URL.
   coverImage is included only when it's a URL or a small enough base64 string
   (> 200 000 chars would make the URL too long on most platforms). */
function buildSharePayload(){
  const cover = binderState.coverImage;
  return {
    v:          1,
    title:      "Loui's Binder",
    coverImage: (!cover || cover.length > 200000) ? null : cover,
    sharedAt:   new Date().toISOString(),
    pages: binderState.pages.map(page =>
      page.map(slot => slot ? {
        name:      slot.name,
        image:     slot.image,
        set:       slot.set      || '',
        owned:     slot.owned,
        quantity:  slot.quantity || 1,
        condition: slot.condition || '',
        price:     slot.price    ?? null
        // stripped: cardId, notes, priceDetails, apiKey, anthropicKey
      } : null)
    )
  };
}

/* shareCollection — builds the share URL and hands off to showSharePanel. */
async function shareCollection(){
  const btn = document.getElementById('generateShareBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Generating…'; }
  try {
    const encoded  = await compressAndEncode(buildSharePayload());
    // binder-share.html lives in the same GitHub Pages repo
    const base     = 'https://claudeaispam-maker.github.io/louis-binder/binder-share.html';
    const url      = `${base}#${encoded}`;
    showSharePanel(url);
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = 'Generate Share Link'; }
    toast('Could not generate link: ' + (e.message || e));
  }
}

    </div>
    <p style="font-size:11px;color:#aaa;margin:8px 0 0 0;">
      Includes ${total} card${total!==1?'s':''} across ${pages} page${pages!==1?'s':''}.
    </p>
    <div class="closeRow"><button class="secondary" id="closeShareBtn">Close</button></div>
  `);
  const copyBtn = document.getElementById('copyShareBtn');
  const copyUrl = () => {
    navigator.clipboard.writeText(url).then(() => {
      copyBtn.textContent = '✓ Copied!';
      setTimeout(() => { if(copyBtn.isConnected) copyBtn.textContent = 'Copy Link'; }, 2000);
    }).catch(() => {
      // Fallback for browsers that block clipboard without user gesture
      document.getElementById('shareUrlInput').select();
    });
  };
  copyBtn.addEventListener('click', copyUrl);
  copyUrl(); // auto-copy immediately when the panel opens
  document.getElementById('closeShareBtn').addEventListener('click', hideOverlay);
}

/* ---------------------------------------------------------------------
   SETTINGS PANEL (API key)
--------------------------------------------------------------------- */
document.getElementById('settingsBtn').addEventListener('click', () => {
  showOverlay(`
    <h2>Settings</h2>
    <div style="background:#eef5ff;border:1px solid #c0d8f5;border-radius:8px;padding:12px;margin-bottom:14px;">
      <div style="font-weight:700;color:#2a5a8c;margin-bottom:4px;">🔗 Share Binder</div>
      <p style="font-size:12px;color:#555;margin:0 0 8px 0;">
        Generate a link anyone can open to view your full collection — read only, no login needed.
      </p>
      <button class="primary" id="generateShareBtn" style="width:100%;">Generate Share Link</button>
    </div>
    <label style="font-size:12px;color:#555;">Pokémon TCG API key (optional — raises search rate limit)</label>
    <input type="text" id="apiKeyInput" placeholder="Paste TCG API key here" value="${escapeHtml(binderState.apiKey || '')}">
    <p style="font-size:12px;color:#888;margin-top:4px;">
      Get a free key at <span style="color:#555">pokemontcg.io</span>. Works without one, just rate-limited.
    </p>
    <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
    <label style="font-size:12px;color:#555;">Claude (Anthropic) API key — <strong>required for 📷 Scan Card</strong></label>
    <input type="text" id="anthropicKeyInput" placeholder="sk-ant-..."
      value="${escapeHtml(binderState.anthropicKey || '')}"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="secondary" id="testKeyBtn" style="margin-top:6px;width:100%;">Test Key</button>
    <div id="keyTestResult" style="font-size:12px;margin-top:4px;"></div>
    <p style="font-size:12px;color:#888;margin-top:4px;">
      Get a key at <span style="color:#555">console.anthropic.com</span>. Requires a billing balance — used to identify cards from your photos. Stored only on this device.
    </p>
    <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
    <p style="font-size:12px;color:#888;">
      Cloud sync: ${firebaseReady ? '<span style="color:green">✓ connected to Firebase</span>' : '<span style="color:#a55">not configured — using local storage on this device only.</span>'}
    </p>
    <button class="primary" id="saveSettingsBtn">Save</button>
    <div class="closeRow"><button class="secondary" id="closeSettingsBtn">Close</button></div>
  `);
  document.getElementById('generateShareBtn').addEventListener('click', shareCollection);
  document.getElementById('saveSettingsBtn').addEventListener('click', () => {
    binderState.apiKey = document.getElementById('apiKeyInput').value.trim();
    binderState.anthropicKey = document.getElementById('anthropicKeyInput').value.trim();
    persist();
    hideOverlay();
    toast('Settings saved.');
  });
  document.getElementById('closeSettingsBtn').addEventListener('click', hideOverlay);

  // Test Key — sends a tiny text-only message to verify the key is valid and has billing
  document.getElementById('testKeyBtn').addEventListener('click', async () => {
    const key = document.getElementById('anthropicKeyInput').value.trim();
    const result = document.getElementById('keyTestResult');
    if (!key){ result.innerHTML = '<span style="color:#c55;">⚠ Paste your key first.</span>'; return; }
    result.innerHTML = '<span style="color:#888;">Testing…</span>';
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'content-type': 'application/json',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001', // cheapest model for key test
          max_tokens: 5,
          messages: [{ role: 'user', content: 'hi' }]
        })
      });
      if (res.ok){
        result.innerHTML = '<span style="color:#4a8;font-weight:600;">✓ Key works! Ready to scan.</span>';
      } else {
        const err = await res.json().catch(() => ({}));
        const msg = err.error?.message || `Error ${res.status}`;
        if (res.status === 401) result.innerHTML = `<span style="color:#c55;">✗ Invalid key — check you copied the full key.</span>`;
        else if (res.status === 403) result.innerHTML = `<span style="color:#c55;">✗ Key not authorized — check billing at console.anthropic.com.</span>`;
        else if (res.status === 429) result.innerHTML = `<span style="color:#c55;">✗ Rate limited — wait a moment and try again.</span>`;
        else result.innerHTML = `<span style="color:#c55;">✗ ${msg}</span>`;
      }
    } catch(e) {
      result.innerHTML = `<span style="color:#c55;">✗ Network error — check your internet connection.</span>`;
    }
  });
});

</script>
</body>
</html>
